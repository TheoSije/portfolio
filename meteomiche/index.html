<!DOCTYPE html>
<html lang="fr">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>météomiche — Eymoutiers</title>
  <meta name="description" content="Météo jardinière à Eymoutiers (87120) : pluie, gel, vent et conseils pour savoir quoi planter selon les conditions du moment.">
  <link rel="canonical" href="https://jegousse.com/meteomiche/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #090e07;
      --card:    #111809;
      --border:  rgba(160, 210, 80, 0.1);
      --accent:  #8ec844;
      --text:    #c8e8a0;
      --muted:   #5a7840;
      --dim:     #2e3e20;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px;
      background: rgba(9,14,7,.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav-back {
      color: var(--muted); text-decoration: none;
      font-size: 13px; transition: color .2s;
    }
    .nav-back:hover { color: var(--text); }
    .nav-sep { flex: 1; }
    .nav-logo { font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: -.02em; }

    /* ── MAIN ── */
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 28px 14px 80px;
    }

    /* ── CONTROLS ── */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .nav-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      width: 40px; height: 40px;
      font-size: 20px; line-height: 1;
      cursor: pointer;
      transition: all .15s;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .nav-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }
    .nav-btn:disabled { opacity: .25; cursor: default; }

    .month-label {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -.03em;
      color: var(--text);
      text-align: center;
      flex: 1;
    }

    /* ── YEAR TABS ── */
    .year-tabs {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .year-tab {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    .year-tab:hover { color: var(--text); border-color: var(--dim); }
    .year-tab.active {
      background: rgba(142,200,68,.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── LOADING ── */
    #loading {
      display: none;
      align-items: center; justify-content: center;
      gap: 10px; height: 300px;
      color: var(--muted); font-size: 13px;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── CALENDAR ── */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      transition: opacity .2s;
    }

    .cal-header {
      text-align: center;
      font-size: 10px; font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--dim);
      padding: 4px 0 10px;
    }

    .day-cell {
      aspect-ratio: 1;
      border-radius: 10px;
      border: 1px solid transparent;
      padding: 5px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: border-color .15s;
      min-height: 52px;
    }

    .day-cell.has-data { cursor: default; }
    .day-cell.has-data:hover { border-color: rgba(160,210,80,.2); }
    .day-cell.empty { background: transparent !important; border-color: transparent !important; }
    .day-cell.is-today { border-color: var(--accent) !important; }
    .day-cell.future { opacity: .3; }

    .cell-num {
      font-size: 10px; font-weight: 600;
      color: var(--muted);
      align-self: flex-start;
      line-height: 1;
    }
    .day-cell.is-today .cell-num { color: var(--accent); }

    .cell-icon {
      font-size: 20px; line-height: 1;
    }

    .cell-temp {
      font-size: 10px; font-weight: 500;
      color: var(--muted);
      line-height: 1;
    }

    /* Rain bar */
    .cell-rain {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 0 0 9px 9px;
      background: rgba(70,140,230,.7);
    }

    /* ── WEATHER TINTS ── */
    .w-sun     { background: rgba(255,210,55,.14); }
    .w-pcloudy { background: rgba(200,215,180,.07); }
    .w-cloudy  { background: rgba(130,150,120,.09); }
    .w-fog     { background: rgba(160,180,150,.08); }
    .w-drizzle { background: rgba(80,150,230,.12); }
    .w-rain    { background: rgba(60,130,220,.18); }
    .w-snow    { background: rgba(160,210,250,.16); }
    .w-shower  { background: rgba(80,150,230,.14); }
    .w-storm   { background: rgba(100,70,220,.20); }
    .w-nodata  { background: rgba(255,255,255,.03); }

    /* ── LEGEND ── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--muted);
    }
    .leg-dot {
      width: 10px; height: 10px;
      border-radius: 3px; flex-shrink: 0;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 380px) {
      .cal-grid { gap: 3px; }
      .day-cell { border-radius: 7px; padding: 3px; min-height: 44px; }
      .cell-icon { font-size: 16px; }
      .cell-num, .cell-temp { font-size: 9px; }
      .month-label { font-size: 18px; }
    }

    @media (min-width: 520px) {
      .day-cell { min-height: 70px; padding: 7px 6px; }
      .cell-icon { font-size: 26px; }
      .cell-num { font-size: 12px; }
      .cell-temp { font-size: 11px; }
    }

    @media (min-width: 640px) {
      .day-cell { min-height: 82px; }
      .cell-icon { font-size: 30px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-back" href="../" onclick="event.preventDefault();if(window.parent!==window){window.parent.postMessage('close-minisite','*');}else{window.location.href='../';}">← theo.design</a>
  <span class="nav-sep"></span>
  <span class="nav-logo">météomiche</span>
</nav>

<main>
  <div class="month-nav">
    <button class="nav-btn" id="btn-prev">‹</button>
    <div class="month-label" id="month-label">—</div>
    <button class="nav-btn" id="btn-next">›</button>
  </div>

  <div class="year-tabs" id="year-tabs"></div>

  <div id="loading"><div class="spinner"></div><span>Chargement…</span></div>

  <div class="cal-grid" id="cal-grid"></div>

  <div class="legend">
    <div class="legend-item"><div class="leg-dot w-sun"></div>Ensoleillé</div>
    <div class="legend-item"><div class="leg-dot w-pcloudy"></div>Nuageux</div>
    <div class="legend-item"><div class="leg-dot w-rain"></div>Pluie</div>
    <div class="legend-item"><div class="leg-dot w-snow"></div>Neige</div>
    <div class="legend-item"><div class="leg-dot w-storm"></div>Orage</div>
    <div class="legend-item" style="flex-basis:100%">La barre bleue en bas de chaque case = quantité de pluie (mm)</div>
  </div>
</main>

<script>
const LAT = 45.733, LON = 1.733;
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DAYS   = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

const today = new Date();
let state = { month: today.getMonth(), year: today.getFullYear() };

// ── WMO → style ──
function wmoStyle(code) {
  if (code === null || code === undefined) return { icon:'', cls:'w-nodata' };
  if (code === 0)  return { icon:'☀️',  cls:'w-sun' };
  if (code <= 2)   return { icon:'🌤️',  cls:'w-pcloudy' };
  if (code === 3)  return { icon:'☁️',  cls:'w-cloudy' };
  if (code <= 48)  return { icon:'🌫️',  cls:'w-fog' };
  if (code <= 55)  return { icon:'🌦️',  cls:'w-drizzle' };
  if (code <= 65)  return { icon:'🌧️',  cls:'w-rain' };
  if (code <= 77)  return { icon:'🌨️',  cls:'w-snow' };
  if (code <= 82)  return { icon:'🌦️',  cls:'w-shower' };
  if (code <= 86)  return { icon:'🌨️',  cls:'w-snow' };
  return                  { icon:'⛈️',  cls:'w-storm' };
}

// ── Utils ──
function isoDate(d) { return d.toISOString().slice(0,10); }
function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
function firstWeekday(y, m) { return (new Date(y, m, 1).getDay() + 6) % 7; } // Mon=0

// ── Fetch ──
async function fetchMonth(year, month) {
  const s   = new Date(year, month, 1);
  const e   = new Date(year, month+1, 0);
  const fmt = d => isoDate(d);
  const V   = 'daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Europe%2FParis';
  const nowY = today.getFullYear(), nowM = today.getMonth();

  if (year < nowY || (year === nowY && month < nowM)) {
    // Full past month → archive
    return fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${LAT}&longitude=${LON}&start_date=${fmt(s)}&end_date=${fmt(e)}&${V}`)
      .then(r => r.json());
  }

  if (year === nowY && month === nowM) {
    // Current month: archive up to 2 days ago + forecast for rest
    const archEnd  = new Date(today); archEnd.setDate(archEnd.getDate() - 2);
    const fcStart  = new Date(archEnd); fcStart.setDate(fcStart.getDate() + 1);
    const fcEnd    = new Date(Math.min(e.getTime(), today.getTime() + 7 * 86400000));

    const reqs = [];
    if (archEnd >= s)
      reqs.push(fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${LAT}&longitude=${LON}&start_date=${fmt(s)}&end_date=${fmt(archEnd)}&${V}`).then(r => r.json()));
    if (fcStart <= fcEnd)
      reqs.push(fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&start_date=${fmt(fcStart)}&end_date=${fmt(fcEnd)}&${V}`).then(r => r.json()));

    const parts = await Promise.all(reqs);
    const out = { daily: { time:[], weather_code:[], temperature_2m_max:[], temperature_2m_min:[], precipitation_sum:[] } };
    for (const p of parts) {
      if (!p.daily) continue;
      for (const k of Object.keys(out.daily)) out.daily[k].push(...(p.daily[k] || []));
    }
    return out;
  }

  return null; // future
}

// ── Render controls ──
function renderControls() {
  document.getElementById('month-label').textContent = `${MONTHS[state.month]} ${state.year}`;

  const nowY = today.getFullYear(), nowM = today.getMonth();
  document.getElementById('btn-next').disabled =
    state.year === nowY && state.month === nowM;

  const tabs = document.getElementById('year-tabs');
  tabs.innerHTML = '';
  for (let y = nowY - 4; y <= nowY; y++) {
    const b = document.createElement('button');
    b.className = 'year-tab' + (y === state.year ? ' active' : '');
    b.textContent = y;
    b.onclick = () => {
      let m = state.month;
      if (y === nowY && m > nowM) m = nowM;
      state.year = y; state.month = m;
      load();
    };
    tabs.appendChild(b);
  }
}

// ── Render calendar ──
function renderCalendar(data) {
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  // Headers
  DAYS.forEach(d => {
    const h = document.createElement('div');
    h.className = 'cal-header';
    h.textContent = d;
    grid.appendChild(h);
  });

  // Build day map
  const dayMap = {};
  if (data && data.daily) {
    (data.daily.time || []).forEach((date, i) => {
      dayMap[+date.slice(8,10)] = {
        code: data.daily.weather_code?.[i],
        tMax: data.daily.temperature_2m_max?.[i],
        rain: data.daily.precipitation_sum?.[i] || 0,
      };
    });
  }

  const total  = daysInMonth(state.year, state.month);
  const offset = firstWeekday(state.year, state.month);
  const todayStr = isoDate(today);
  const maxRain = Math.max(...Object.values(dayMap).map(d => d.rain || 0), 1);

  // Empty cells before month starts
  for (let i = 0; i < offset; i++) {
    const c = document.createElement('div');
    c.className = 'day-cell empty';
    grid.appendChild(c);
  }

  for (let d = 1; d <= total; d++) {
    const ds = `${state.year}-${String(state.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday  = ds === todayStr;
    const isFuture = ds > todayStr;
    const dd       = dayMap[d];
    const hasData  = dd && dd.code !== null && dd.code !== undefined;
    const st       = hasData ? wmoStyle(dd.code) : { icon:'', cls:'w-nodata' };

    const cell = document.createElement('div');
    cell.className = `day-cell ${st.cls}${isToday ? ' is-today' : ''}${isFuture ? ' future' : ''}${hasData ? ' has-data' : ''}`;

    // Day number
    const num = document.createElement('div');
    num.className = 'cell-num';
    num.textContent = d;
    cell.appendChild(num);

    // Icon
    const icon = document.createElement('div');
    icon.className = 'cell-icon';
    if (hasData) icon.textContent = st.icon;
    cell.appendChild(icon);

    // Temp
    const temp = document.createElement('div');
    temp.className = 'cell-temp';
    if (hasData && dd.tMax !== null && dd.tMax !== undefined)
      temp.textContent = `${Math.round(dd.tMax)}°`;
    cell.appendChild(temp);

    // Rain bar
    if (hasData && dd.rain > 0.5) {
      const bar = document.createElement('div');
      bar.className = 'cell-rain';
      bar.style.opacity = (0.35 + (dd.rain / maxRain) * 0.65).toFixed(2);
      cell.appendChild(bar);
    }

    grid.appendChild(cell);
  }
}

// ── Navigation ──
document.getElementById('btn-prev').onclick = () => {
  if (--state.month < 0) { state.month = 11; state.year--; }
  load();
};
document.getElementById('btn-next').onclick = () => {
  if (++state.month > 11) { state.month = 0; state.year++; }
  load();
};

// ── Load ──
async function load() {
  renderControls();
  const grid = document.getElementById('cal-grid');
  document.getElementById('loading').style.display = 'flex';
  grid.style.opacity = '.25';

  try {
    const data = await fetchMonth(state.year, state.month);
    renderCalendar(data);
  } catch(e) {
    grid.innerHTML = `<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--muted);font-size:13px">Impossible de charger les données.</div>`;
  }

  document.getElementById('loading').style.display = 'none';
  grid.style.opacity = '1';
}

load();
</script>
</body>
</html>
