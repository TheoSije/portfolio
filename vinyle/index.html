<html lang="fr">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinyle — theo.design</title>
<meta name="description" content="Écoute et explore ta musique Spotify autour d'un vinyle interactif. Une expérience visuelle et sonore inspirée des platines.">
<link rel="canonical" href="https://jegousse.com/vinyle/">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #0a0a0a;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── BG ART (crossfade) ── */
.bg-layer {
  position: fixed;
  inset: -100px;
  z-index: 0;
  background-size: cover;
  background-position: center;
  filter: blur(90px) saturate(2) brightness(0.28);
  transform: scale(1.15);
  opacity: 0;
  transition: opacity 1.5s ease;
  will-change: opacity;
  pointer-events: none;
}
/* dark base always visible behind */
#bg-base {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: #0a0a0a;
  pointer-events: none;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: 48px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,.06);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 14px;
}
.nav-back {
  display: flex; align-items: center; gap: 7px;
  color: rgba(255,255,255,.32);
  font-size: 12px; letter-spacing: .04em;
  transition: color .2s; cursor: pointer;
  background: none; border: none;
  font-family: 'DM Sans', sans-serif;
  padding: 0; text-decoration: none;
}
.nav-back:hover { color: rgba(255,255,255,.7); }
.nav-sep { width: 1px; height: 13px; background: rgba(255,255,255,.1); }
.nav-logo { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.65); }

/* ── MAIN ── */
main {
  height: 100vh;
  padding-top: 102px;
  padding-bottom: 88px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  padding-left: 24px;
  padding-right: 24px;
  position: relative;
  z-index: 1;
}

/* ── GENRE TABS ── */
.genre-tabs {
  position: fixed;
  top: 48px;
  left: 0; right: 0;
  z-index: 99;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 10px 24px;
  justify-content: center;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,.05);
}
.genre-tabs::-webkit-scrollbar { display: none; }

.genre-tab {
  flex-shrink: 0;
  padding: 7px 16px;
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.06);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: rgba(255,255,255,.5);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .03em;
  cursor: pointer;
  transition: all .22s ease;
}
.genre-tab:hover {
  background: rgba(255,255,255,.13);
  color: rgba(255,255,255,.85);
  border-color: rgba(255,255,255,.32);
}
.genre-tab.active {
  background: rgba(255,255,255,.2);
  color: #fff;
  border-color: rgba(255,255,255,.45);
  box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset;
}

/* ── VINYL ── */
.vinyl-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.vinyl {
  --vs: clamp(200px, min(72vw, calc(100svh - 300px)), 360px);
  width: var(--vs);
  height: var(--vs);
  border-radius: 50%;
  position: relative;
  flex-shrink: 0;
  background:
    radial-gradient(circle at 50% 50%, #040404 0 2%, transparent 2%),
    repeating-radial-gradient(
      circle at 50% 50%,
      transparent 0px,
      transparent 2px,
      rgba(255,255,255,0.028) 2px,
      rgba(255,255,255,0.028) 3px
    ),
    #0f0f0f;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.06),
    0 28px 90px rgba(0,0,0,0.85),
    inset 0 0 80px rgba(0,0,0,0.4);
  cursor: pointer;
}

.vinyl::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(
    circle at 30% 25%,
    rgba(255,255,255,0.07) 0%,
    transparent 55%
  );
  pointer-events: none;
}

.vinyl-label {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 38%; height: 38%;
  border-radius: 50%;
  overflow: hidden;
  background: #1e1e1e no-repeat center/cover;
  box-shadow: 0 0 0 1.5px rgba(255,255,255,0.1), 0 4px 20px rgba(0,0,0,0.7);
  transition: background-image .3s ease;
}
.vinyl-label::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #050505;
  z-index: 2;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
}

@keyframes pulse { 0%,100% { opacity:.4; } 50% { opacity:.75; } }
.vinyl-label.loading { animation: pulse 1.5s ease-in-out infinite; }

/* ── TRACK INFO ── */
.track-info { text-align: center; max-width: 500px; width: 100%; }

.track-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(18px, 3.5vw, 28px);
  font-style: italic;
  font-weight: 700;
  color: #fff;
  line-height: 1.25;
  margin-bottom: 7px;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .38s ease, transform .38s ease;
}
.track-title.visible { opacity: 1; transform: translateY(0); }

.track-sub {
  font-size: clamp(11px, 1.4vw, 13px);
  font-weight: 400;
  color: rgba(255,255,255,.38);
  letter-spacing: .05em;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .38s ease .08s, transform .38s ease .08s;
}
.track-sub.visible { opacity: 1; transform: translateY(0); }

/* ── PLAYER CONTROLS ── */
.timer-btn {
  position: relative;
  width: 64px; height: 64px;
  border: none; background: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: 0; flex-shrink: 0;
}
.timer-ring {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  transform: rotate(-90deg);
}
.timer-ring-bg { fill: none; stroke: rgba(255,255,255,.1); stroke-width: 1.5; }
.timer-ring-fill {
  fill: none; stroke: rgba(255,255,255,.55); stroke-width: 1.5;
  stroke-linecap: round;
  stroke-dasharray: 175.93;
  stroke-dashoffset: 0;
}
.play-inner {
  position: relative; z-index: 1;
  width: 52px; height: 52px;
  border-radius: 50%; background: #fff;
  display: flex; align-items: center; justify-content: center;
  transition: transform .2s cubic-bezier(0.34,1.56,0.64,1), background .2s;
}
.timer-icon { color: #111; display: flex; align-items: center; justify-content: center; }
.timer-btn:hover .play-inner { transform: scale(1.06); background: #f0f0f0; }
.timer-btn:active .play-inner { transform: scale(0.94); }

.player-group { display: flex; align-items: center; gap: 2px; }
.ctrl-arrow {
  width: 56px; height: 64px;
  border: none; background: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,.5);
  transition: color .18s, transform .18s; padding: 0;
}
.ctrl-arrow:hover { color: rgba(255,255,255,.9); transform: scale(1.1); }
.ctrl-arrow:active { transform: scale(0.9); }

.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 90;
  display: flex; align-items: center; justify-content: center;
  padding: 10px 0 22px;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,.08);
}

/* ── COVER LIGHTBOX ── */
.cover-overlay {
  position: fixed; inset: 0; z-index: 300;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  opacity: 0; pointer-events: none;
  transition: opacity .32s ease;
}
.cover-overlay.open { opacity: 1; pointer-events: all; }
.cover-backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.78);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.cover-img-wrap {
  position: relative; z-index: 1;
  border-radius: 16px; overflow: hidden;
  box-shadow: 0 32px 100px rgba(0,0,0,.8);
  transform: scale(.88);
  transition: transform .38s cubic-bezier(0.34,1.2,0.64,1);
  width: min(82vw, 82vh, 520px);
  height: min(82vw, 82vh, 520px);
  flex-shrink: 0;
}
.cover-overlay.open .cover-img-wrap { transform: scale(1); }
.cover-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover-info {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 20px 20px 18px;
  background: linear-gradient(to top, rgba(0,0,0,.75) 0%, transparent 100%);
  z-index: 2;
}
.cover-title {
  font-family: 'Playfair Display', serif;
  font-size: 16px; font-style: italic; font-weight: 700;
  color: #fff; line-height: 1.3; margin-bottom: 3px;
}
.cover-artist { font-size: 12px; color: rgba(255,255,255,.6); letter-spacing: .04em; }

/* ── SHARE BUTTON ── */
.share-btn {
  position: absolute; right: 24px;
  background: none; border: none;
  color: rgba(255,255,255,.4);
  cursor: pointer; padding: 8px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: color .2s;
}
.share-btn:hover { color: rgba(255,255,255,.85); }

/* ── SHARE OVERLAY ── */
.share-overlay {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease;
}
.share-overlay.open { opacity: 1; pointer-events: all; }
.share-backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.share-sheet {
  position: relative; z-index: 1;
  background: rgba(24,24,26,.97);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid rgba(255,255,255,.1); border-bottom: none;
  border-radius: 20px 20px 0 0;
  padding: 14px 20px 36px;
  width: 100%; max-width: 480px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  transform: translateY(20px);
  transition: transform .32s cubic-bezier(0.34,1.1,0.64,1);
}
.share-overlay.open .share-sheet { transform: translateY(0); }
.share-handle { width: 36px; height: 4px; background: rgba(255,255,255,.16); border-radius: 2px; flex-shrink: 0; }
#share-canvas { border-radius: 10px; box-shadow: 0 8px 40px rgba(0,0,0,.7); display: block; }
.share-row { display: flex; align-items: center; gap: 12px; width: 100%; }
.share-label { font-size: 11px; color: rgba(255,255,255,.38); letter-spacing: .07em; text-transform: uppercase; min-width: 52px; }
#fmt-opts { display: flex; gap: 6px; }
.share-opt {
  background: none; border: 1px solid rgba(255,255,255,.18);
  color: rgba(255,255,255,.5); font-family: 'DM Sans', sans-serif;
  font-size: 12px; padding: 5px 14px; border-radius: 100px;
  cursor: pointer; transition: all .18s;
}
.share-opt:hover { border-color: rgba(255,255,255,.4); color: #fff; }
.share-opt.active { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.38); color: #fff; }
.share-actions { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.share-actions-row { display: flex; gap: 8px; }
.share-dl-btn, .share-copy-btn, .share-close-btn {
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  border-radius: 100px; cursor: pointer; padding: 10px 0;
  transition: all .18s; width: 100%; text-align: center;
  border: 1px solid rgba(255,255,255,.16);
}
.share-dl-btn { background: rgba(255,255,255,.1); color: #fff; flex: 1; }
.share-dl-btn:hover { background: rgba(255,255,255,.18); }
.share-close-btn { background: none; color: rgba(255,255,255,.4); flex: 1; }
.share-close-btn:hover { color: rgba(255,255,255,.75); }
.share-copy-btn { background: none; color: rgba(255,255,255,.45); }
.share-copy-btn:hover { color: #fff; border-color: rgba(255,255,255,.4); }

@media (max-width: 600px) {
  nav { padding: 0 16px; }
  main { gap: 16px; padding-left: 16px; padding-right: 16px; }
  .genre-tab { padding: 6px 13px; font-size: 11px; }
}

body.in-iframe nav { display: none; }
body.in-iframe main { padding-top: 0; }
</style>
</head>
<body>

<!-- bg art layers for crossfade -->
<div id="bg-base" aria-hidden="true"></div>
<div class="bg-layer" id="bg-a" aria-hidden="true"></div>
<div class="bg-layer" id="bg-b" aria-hidden="true"></div>

<nav>
  <a class="nav-back" href="../" onclick="event.preventDefault();if(window.parent!==window){window.parent.postMessage('close-minisite','*');}else{window.location.href='../';}">← theo.design</a>
  <div class="nav-sep"></div>
  <span class="nav-logo">vinyle</span>
</nav>

<div class="genre-tabs" id="genre-tabs">
  <button class="genre-tab active" data-genre="favoris"  onclick="setGenre(this)">Favoris</button>
  <button class="genre-tab"        data-genre="jazz"     onclick="setGenre(this)">Jazz</button>
  <button class="genre-tab"        data-genre="rai"      onclick="setGenre(this)">Raï</button>
  <button class="genre-tab"        data-genre="caraibes" onclick="setGenre(this)">Caraïbes</button>
  <button class="genre-tab"        data-genre="rapfr"    onclick="setGenre(this)">Rap FR</button>
</div>

<main>
  <div class="vinyl-wrap">
    <div class="vinyl" id="vinyl" onclick="openCover()" title="Voir la pochette">
      <div class="vinyl-label loading" id="vinyl-label"></div>
    </div>
  </div>

  <div class="track-info">
    <p class="track-title" id="track-title">Chargement…</p>
    <p class="track-sub"   id="track-sub"></p>
  </div>

  <button id="retry-btn" onclick="loadTracks()" style="display:none;align-items:center;gap:8px;background:none;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.6);font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:.06em;padding:9px 20px;border-radius:100px;cursor:pointer;transition:all .2s;" onmouseover="this.style.borderColor='rgba(255,255,255,.4)';this.style.color='#fff'" onmouseout="this.style.borderColor='rgba(255,255,255,.18)';this.style.color='rgba(255,255,255,.6)'">↺ Réessayer</button>
</main>

<div class="bottom-bar">
  <button class="share-btn" onclick="openShare()" title="Partager">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>

  <div class="player-group">
    <button class="ctrl-arrow" onclick="prev()" title="Précédent">

      <svg class="timer-ring" viewBox="0 0 64 64">

      <div class="play-inner">

        </span>

    <button class="ctrl-arrow" onclick="next()" title="Suivant">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>

<!-- SHARE OVERLAY -->

        <button class="share-close-btn" onclick="closeShare()">Fermer</button>
      </div>
      <button class="share-copy-btn" id="share-copy-btn" onclick="copyShareLink()">⎘ Copier le lien</button>
    </div>
  </div>
</div>

<!-- COVER LIGHTBOX -->
<div class="cover-overlay" id="cover-overlay">
  <div class="cover-backdrop" onclick="closeCover()"></div>
  <div class="cover-img-wrap">
    <img class="cover-img" id="cover-img" src="" alt="Pochette">
    <div class="cover-info">
      <p class="cover-title" id="cover-title"></p>
      <p class="cover-artist" id="cover-artist"></p>
    </div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
// ── Genre queries ──
const GENRE_QUERIES = {
  favoris: [
    'miles+davis', 'chet+baker', 'bill+evans+trio',
    'nina+simone', 'billie+holiday', 'joao+gilberto',
    'stan+getz', 'ella+fitzgerald', 'charles+mingus',
  ],
  jazz: [
    'john+coltrane', 'thelonious+monk', 'art+blakey',
    'herbie+hancock', 'charlie+parker', 'duke+ellington',
    'oscar+peterson', 'wes+montgomery', 'sonny+rollins',
  ],
  rai: [
    'cheb+khaled', 'cheb+mami', 'cheb+hasni',
    'rachid+taha', 'faudel', 'cheb+akil',
    'khaled+didi', 'cheba+fadela', 'cheb+bilal',
  ],
  caraibes: [
    'kassav+zouk', 'zouk+love', 'tabou+combo',
    'malavoi', 'compas+direct', 'exile+one',
    'jacob+desvarieux', 'ibo+zouk', 'admiral+t',
  ],
  rapfr: [
    'nekfeu', 'booba', 'iam+rap+francais',
    'lacrim', 'damso', 'niro+rap',
    'kaaris', 'rohff', 'kery+james',
  ],
};

let activeGenre = 'favoris';
let tracks  = [];
let current = 0;

const audio    = document.getElementById('audio');
const vinyl    = document.getElementById('vinyl');
const label    = document.getElementById('vinyl-label');
const titleEl  = document.getElementById('track-title');
const subEl    = document.getElementById('track-sub');
const ringFill = document.getElementById('timer-ring-fill');
const timerIcon= document.getElementById('timer-icon');

const CIRCUMFERENCE = 2 * Math.PI * 28;
const PAUSE_SVG = `<svg width="9" height="10" viewBox="0 0 9 10" fill="currentColor"><rect x="0" y="0" width="3" height="10" rx="1"/><rect x="6" y="0" width="3" height="10" rx="1"/></svg>`;
const PLAY_SVG  = `<svg width="9" height="10" viewBox="0 0 10 10" fill="currentColor"><polygon points="1,0 10,5 1,10"/></svg>`;

// ── BG crossfade ──
let bgActive = 'a';
function updateBg(artUrl) {
  const next   = bgActive === 'a' ? 'b' : 'a';
  const nextEl = document.getElementById('bg-' + next);
  const currEl = document.getElementById('bg-' + bgActive);
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    nextEl.style.backgroundImage = `url(${img.src})`;
    nextEl.style.opacity = '1';
    setTimeout(() => { currEl.style.opacity = '0'; }, 80);
    bgActive = next;
  };
  // use larger art for richer bg colors
  img.src = artUrl.replace(/\d+x\d+bb/, '300x300bb');
}

// ── Genre switch ──
function setGenre(btn) {
  if (btn.dataset.genre === activeGenre) return;
  document.querySelectorAll('.genre-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeGenre = btn.dataset.genre;
  loadTracks();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ── Visual spin loop ──
const DEG_PER_MS = 360 * 33.33 / 60000;
let currentAngle = 0, lastTs = null, spinRAF = null;
let spinRate = 0;

function spinTick(ts) {
  if (lastTs !== null)
    currentAngle = (currentAngle + DEG_PER_MS * (ts - lastTs) * spinRate) % 360;
  lastTs = ts;
  vinyl.style.transform = `rotate(${currentAngle}deg)`;
  spinRAF = requestAnimationFrame(spinTick);
}

let rampRAF, isRamping = false;

function rampSpinTo(target, duration, onDone) {
  cancelAnimationFrame(rampRAF);
  isRamping = true;
  if (!spinRAF) { lastTs = null; spinRAF = requestAnimationFrame(spinTick); }
  const from = spinRate, t0 = performance.now();
  (function ramp() {
    const p = Math.min((performance.now() - t0) / duration, 1);
    const e = target > from ? p * (2 - p) : p * p;
    spinRate = from + (target - from) * e;
    if (p < 1) { rampRAF = requestAnimationFrame(ramp); return; }
    spinRate = target;
    isRamping = false;
    if (onDone) onDone();
  })();
}

function stopVinyl() {
  audio.pause();
  rampSpinTo(0, 700, () => { cancelAnimationFrame(spinRAF); spinRAF = null; lastTs = null; });
}
function startVinyl() {
  audio.play().catch(() => {});
  rampSpinTo(1, 500);
}

// ── Share ──
const SHARE_FORMATS = { square: { w: 1080, h: 1080 }, story: { w: 1080, h: 1920 } };
let shareFmt = 'square';
let shareArtImg = null;

function openShare() {
  if (!tracks.length) return;
  document.getElementById('share-overlay').classList.add('open');
  const url = tracks[current].artworkUrl100.replace(/\d+x\d+bb/, '600x600bb');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload  = () => { shareArtImg = img; renderShareCanvas(); };
  img.onerror = () => { shareArtImg = null; renderShareCanvas(); };
  img.src = url;
  renderShareCanvas();
}
function closeShare() { document.getElementById('share-overlay').classList.remove('open'); }

function setShareFmt(btn) {
  shareFmt = btn.dataset.fmt;
  document.querySelectorAll('#fmt-opts .share-opt').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderShareCanvas();
}

function renderShareCanvas() {
  const canvas = document.getElementById('share-canvas');
  const { w, h } = SHARE_FORMATS[shareFmt];
  canvas.width  = w; canvas.height = h;
  const maxW = Math.min(320, window.innerWidth - 80);
  const s = Math.min(maxW / w, 280 / h);
  canvas.style.width  = Math.round(w * s) + 'px';
  canvas.style.height = Math.round(h * s) + 'px';
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, w, h);
  if (shareArtImg) {
    ctx.save();
    ctx.filter = 'blur(55px) saturate(1.3)';
    const sc = Math.max(w / shareArtImg.width, h / shareArtImg.height) * 1.4;
    const iw = shareArtImg.width * sc, ih = shareArtImg.height * sc;
    ctx.drawImage(shareArtImg, (w - iw) / 2, (h - ih) / 2, iw, ih);
    ctx.filter = 'none';
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.58)';
  ctx.fillRect(0, 0, w, h);
  const R = Math.min(w, h) * 0.33;
  const cx = w / 2;
  const cy = shareFmt === 'story' ? h * 0.38 : h * 0.46;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = '#0d0d0d'; ctx.fill();
  for (let r = R * 0.40; r < R * 0.96; r += R * 0.028) {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.09)'; ctx.lineWidth = 2; ctx.stroke();
  if (shareArtImg) {
    const lr = R * 0.345;
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, lr, 0, Math.PI * 2); ctx.clip();
    ctx.drawImage(shareArtImg, cx - lr, cy - lr, lr * 2, lr * 2); ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cy, lr, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.032, 0, Math.PI * 2);
  ctx.fillStyle = '#040404'; ctx.fill();
  const t = tracks[current]; if (!t) return;
  const textY = shareFmt === 'story' ? h * 0.65 : h * 0.80;
  const pad   = w * 0.1;
  ctx.textAlign = 'center';
  const titleSize = Math.round(w * 0.05);
  ctx.font = `700 italic ${titleSize}px 'Playfair Display', Georgia, serif`;
  ctx.fillStyle = '#fff';
  const words = t.trackName.split(' ');
  let line = '', lines = [];
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > w - pad * 2 && line) { lines.push(line); line = word; }
    else line = test;
  }
  lines.push(line);
  const lh = titleSize * 1.3;
  lines.forEach((l, i) => ctx.fillText(l, cx, textY + i * lh));
  const subSize = Math.round(w * 0.027);
  ctx.font = `400 ${subSize}px 'DM Sans', system-ui, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.52)';
  ctx.fillText(`${t.artistName}  ·  ${t.collectionName}`, cx, textY + lines.length * lh + subSize * 1.4);
  const brandSize = Math.round(w * 0.021);
  ctx.font = `400 ${brandSize}px 'DM Sans', system-ui, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fillText('theo.design/vinyle', cx, h - h * 0.045);
}

function downloadCard() {
  const canvas = document.getElementById('share-canvas');
  const t = tracks[current];
  const name = t ? t.trackName.replace(/[^a-z0-9]/gi, '-').toLowerCase() : 'vinyle';
  try {
    const link = document.createElement('a');
    link.download = `vinyle-${name}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) {
    alert('Impossible d\'exporter — problème CORS sur la pochette.');
  }
}

async function copyShareLink() {
  const btn = document.getElementById('share-copy-btn');
  const url = window.location.href;
  const t   = tracks[current];
  try {
    if (navigator.share && /Mobi|Android/i.test(navigator.userAgent)) {
      await navigator.share({ title: t ? t.trackName : 'vinyle', url });
      return;
    }
    await navigator.clipboard.writeText(url);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  btn.textContent = '✓ Lien copié !';
  setTimeout(() => { btn.textContent = '⎘ Copier le lien'; }, 2200);
}

function fetchWithTimeout(url, ms = 7000) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal })
    .then(r => r.json())
    .catch(() => ({ results: [] }))
    .finally(() => clearTimeout(id));
}

async function loadTracks() {
  titleEl.textContent = 'Chargement…';
  titleEl.classList.add('visible');
  subEl.classList.remove('visible');
  document.getElementById('retry-btn').style.display = 'none';
  label.classList.add('loading');

  const queries = GENRE_QUERIES[activeGenre];
  const selected = [...queries].sort(() => .5 - Math.random()).slice(0, 4);
  const results  = await Promise.all(
    selected.map(q => fetchWithTimeout(`https://itunes.apple.com/search?term=${q}&media=music&limit=15`))
  );
  const seen = new Set();
  tracks = results
    .flatMap(d => d.results || [])
    .filter(t => t.previewUrl && !seen.has(t.trackId) && seen.add(t.trackId));
  shuffle(tracks);

  if (!tracks.length) {
    titleEl.textContent = 'Impossible de charger les morceaux.';
    subEl.textContent = 'Vérifiez votre connexion.';
    subEl.classList.add('visible');
    document.getElementById('retry-btn').style.display = 'flex';
    label.classList.remove('loading');
    return;
  }
  current = 0;
  showTrack(0);
}

function showTrack(idx) {
  cancelAnimationFrame(rampRAF);
  isRamping = false;
  const t = tracks[idx];

  titleEl.classList.remove('visible');
  subEl.classList.remove('visible');

  setTimeout(() => {
    const art = t.artworkUrl100.replace(/\d+x\d+bb/, '600x600bb');

    // Update bg gradient
    updateBg(t.artworkUrl100);

    const img = new Image();
    img.onload = () => {
      label.classList.remove('loading');
      label.style.backgroundImage = `url(${art})`;
    };
    img.src = art;

    titleEl.textContent = t.trackName;
    subEl.textContent   = `${t.artistName} · ${t.collectionName}`;
    titleEl.classList.add('visible');
    subEl.classList.add('visible');

    ringFill.style.strokeDashoffset = 0;

    audio.src = t.previewUrl;
    audio.play().catch(() => setPlaying(false));
  }, 180);
}

function setPlaying(state) {
  if (state) {
    vinyl.classList.add('playing');
    timerIcon.innerHTML = PAUSE_SVG;
    if (!isRamping) rampSpinTo(1, 500);
  } else {
    vinyl.classList.remove('playing');
    timerIcon.innerHTML = PLAY_SVG;
  }
}

function togglePlay() {
  if (isRamping) return;
  if (audio.paused) startVinyl();
  else stopVinyl();
}

function next() { current = (current + 1) % tracks.length; showTrack(current); }
function prev() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  current = (current - 1 + tracks.length) % tracks.length;
  showTrack(current);
}

audio.addEventListener('play',  () => setPlaying(true));
audio.addEventListener('pause', () => setPlaying(false));
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const progress = 1 - (audio.currentTime / audio.duration);
  ringFill.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
});
audio.addEventListener('ended', () => next());

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeCover(); return; }
  if (document.getElementById('cover-overlay').classList.contains('open')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prev();
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});

function openCover() {
  if (!tracks.length) return;
  const t = tracks[current];
  const art = t.artworkUrl100.replace(/\d+x\d+bb/, '3000x3000bb');
  document.getElementById('cover-img').src    = art;
  document.getElementById('cover-title').textContent  = t.trackName;
  document.getElementById('cover-artist').textContent = `${t.artistName} · ${t.collectionName}`;
  document.getElementById('cover-overlay').classList.add('open');
}
function closeCover() { document.getElementById('cover-overlay').classList.remove('open'); }

// ── Boot ──
loadTracks();
if (window.self !== window.top) document.body.classList.add('in-iframe');
</script>
