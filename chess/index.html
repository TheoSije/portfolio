<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Puzzles — theo.design</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #111;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: 48px;
  background: #111;
  border-bottom: 1px solid rgba(255,255,255,.07);
  display: flex;
  align-items: center;
  padding: 0 24px;
}
.nav-back {
  display: flex; align-items: center; gap: 7px;
  color: rgba(255,255,255,.35); font-size: 12px; letter-spacing: .04em;
  cursor: pointer; background: none; border: none; transition: color .2s;
}
.nav-back:hover { color: #fff; }
.nav-back svg { width: 14px; height: 14px; }
.nav-title {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,.4); letter-spacing: .04em;
}

/* ── MAIN ── */
.main {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  padding-top: 48px;
  gap: 24px;
}

/* ── BOARD ── */
.board-wrap { user-select: none; position: relative; }

#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,.7);
}

.cell {
  width: 72px; height: 72px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative;
}
.cell.light { background: #eedcb0; }
.cell.dark  { background: #b58863; }

.cell.selected  { background: rgba(255,220,0,.6) !important; }
.cell.last-from { background: rgba(255,220,0,.3) !important; }
.cell.last-to   { background: rgba(255,220,0,.5) !important; }
.cell.wrong     { background: rgba(220,60,60,.55) !important; }

/* ── PIECES ── */
/* Use solid filled glyphs for both colors, differentiate via CSS */
.piece {
  font-size: 44px;
  line-height: 1;
  pointer-events: none;
  font-family: 'Segoe UI Symbol', 'Apple Symbols', 'Symbola', serif;
}
.piece.w {
  color: #fff;
  -webkit-text-stroke: 1.5px #333;
  text-shadow: 0 2px 6px rgba(0,0,0,.5);
}
.piece.b {
  color: #1a1a1a;
  -webkit-text-stroke: 0.5px rgba(255,255,255,.15);
  text-shadow: 0 2px 4px rgba(0,0,0,.5);
}

/* ── INFO BAR ── */
.info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  min-height: 80px;
}

.puzzle-title {
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  letter-spacing: .01em;
}

.status {
  font-size: 13px;
  color: rgba(255,255,255,.4);
  transition: color .2s;
}
.status.ok    { color: #4ade80; }
.status.err   { color: #f87171; }
.status.think { color: #facc15; }

.btn-row {
  display: flex; gap: 10px;
  margin-top: 2px;
}
.btn {
  padding: 9px 20px;
  border-radius: 8px; border: none;
  font-family: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .2s;
}
.btn-primary { background: #fff; color: #111; }
.btn-primary:hover { opacity: .85; }
.btn-ghost   { background: rgba(255,255,255,.08); color: rgba(255,255,255,.6); }
.btn-ghost:hover { background: rgba(255,255,255,.14); color: #fff; }
.hidden { display: none !important; }

/* ── END OVERLAY ── */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(6px);
  z-index: 200;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 14px; text-align: center;
}
.overlay.show { display: flex; }
.overlay-title { font-size: 26px; font-weight: 600; }
.overlay-sub   { font-size: 14px; color: rgba(255,255,255,.45); }
.overlay-btn {
  margin-top: 8px; padding: 12px 28px;
  background: #fff; color: #111;
  border: none; border-radius: 8px;
  font-family: inherit; font-size: 14px; font-weight: 500;
  cursor: pointer;
}
.overlay-btn:hover { opacity: .85; }

/* ── RESPONSIVE ── */
@media (max-width: 700px) {
  .cell { width: 44px; height: 44px; }
  .piece { font-size: 28px; }
}
@media (max-height: 600px) {
  .main { gap: 12px; }
  .cell { width: 52px; height: 52px; }
  .piece { font-size: 32px; }
}
</style>
</head>
<body>

<nav>
  <button class="nav-back" onclick="history.back()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M10 3L5 8l5 5"/>
    </svg>
    Retour
  </button>
  <span class="nav-title">Chess Puzzles</span>
</nav>

<div class="main">
  <div class="board-wrap">
    <div id="board"></div>
  </div>

  <div class="info">
    <div class="puzzle-title" id="puz-title"></div>
    <div class="status" id="status">Trouvez le meilleur coup.</div>
    <div class="btn-row">
      <button class="btn btn-ghost hidden" id="btn-restart" onclick="restartPuzzle()">Recommencer</button>
      <button class="btn btn-primary hidden" id="btn-next" onclick="nextPuzzle()">Puzzle suivant →</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div style="font-size:48px;">♟</div>
  <div class="overlay-title">Tous les puzzles résolus !</div>
  <div class="overlay-sub">Bravo, tu as tout résolu.</div>
  <button class="overlay-btn" onclick="resetAll()">Recommencer depuis le début</button>
</div>

<script>
// Solid filled glyph for all pieces (color differentiated via CSS)
const G = { K:'♚', Q:'♛', R:'♜', B:'♝', N:'♞', P:'♟' };

const PUZZLES = [
  {
    title: "Mat en 1 — Dame",
    toMove: 'w',
    board: { g1:'wK', h5:'wQ', e1:'wR', g8:'bK', f7:'bP', g7:'bP', h7:'bP' },
    solution: [["h5","f7"]],
  },
  {
    title: "Mat en 1 — Tour",
    toMove: 'w',
    board: { a1:'wK', h1:'wR', a8:'bK', b7:'bR', a7:'bP' },
    solution: [["h1","h8"]],
  },
  {
    title: "Fourchette de cavalier",
    toMove: 'w',
    board: { e1:'wK', g1:'wR', f6:'wN', e8:'bK', d8:'bQ' },
    solution: [["f6","e8"]],
  },
  {
    title: "Mat en 1 — Sacrifice",
    toMove: 'w',
    board: { e1:'wK', a1:'wR', h8:'wQ', e8:'bK', d8:'bQ', c8:'bB' },
    solution: [["h8","e8"]],
  },
  {
    title: "Clouage de dame",
    toMove: 'w',
    board: { g1:'wK', a1:'wR', c4:'wB', e8:'bK', e6:'bQ', e2:'bP' },
    solution: [["a1","e1"]],
  },
  {
    title: "Mat en 2 — Tour et Dame",
    toMove: 'w',
    board: { g1:'wK', f1:'wR', d5:'wQ', g8:'bK', h7:'bP', g7:'bP', f8:'bR' },
    solution: [["d5","h5"], ["g7","g6"], ["h5","g6"]],
  },
  {
    title: "Mat de l'escalier",
    toMove: 'w',
    board: { g1:'wK', a1:'wR', a2:'wR', h8:'bK' },
    solution: [["a2","h2"], ["h8","g8"], ["a1","g1"]],
  },
  {
    title: "Surcharge — Mat en 2",
    toMove: 'w',
    board: { g1:'wK', d1:'wR', a4:'wB', e8:'bK', d8:'bR', d7:'bQ', e7:'bP' },
    solution: [["a4","e8"], ["d7","e8"], ["d1","d8"]],
  },
  {
    title: "Mat en 2 — Attaque coordonnée",
    toMove: 'w',
    board: { g1:'wK', f1:'wR', h1:'wR', d3:'wQ', g8:'bK', f8:'bR', h8:'bR', g7:'bP', h7:'bP', f7:'bP' },
    solution: [["d3","h7"], ["g8","f8"], ["h1","h8"]],
  },
  {
    title: "Mat de Morphy",
    toMove: 'w',
    board: { g1:'wK', a1:'wR', d8:'wR', b6:'wB', g8:'bK', h8:'bR', f8:'bB', g7:'bP', h7:'bP' },
    solution: [["d8","h8"], ["g8","h8"], ["a1","a8"]],
  },
  {
    title: "Mat de Légal",
    toMove: 'w',
    board: { e1:'wK', d1:'wQ', f3:'wN', c4:'wB', e5:'wN', e8:'bK', d8:'bQ', f6:'bN', c6:'bN', g4:'bB' },
    solution: [["e5","f7"], ["e8","f7"], ["d1","g4"]],
  },
  {
    title: "Promotion décisive",
    toMove: 'w',
    board: { g1:'wK', h7:'wP', b1:'wR', e8:'bK', h8:'bR' },
    solution: [["b1","b8"], ["h8","b8"], ["h7","h8"]],
  },
  {
    title: "Mat de l'étouffement",
    toMove: 'w',
    board: { g1:'wK', h1:'wR', g4:'wN', h8:'bK', g8:'bR', h7:'bP', g7:'bP' },
    solution: [["g4","h6"], ["h8","g8"], ["h1","h8"]],
  },
];

// ── STATE ──
let pidx = 0, state = {}, selected = null, step = 0;
let lastFrom = null, lastTo = null, wrongCell = null;

function sq(c,r)    { return String.fromCharCode(97+c)+(r+1); }
function col(s)     { return s.charCodeAt(0)-97; }
function row(s)     { return parseInt(s[1])-1; }
function cid(c,r)   { return 'c'+c+r; }
function cell(s)    { return document.getElementById(cid(col(s),row(s))); }

function setup(idx) {
  pidx = idx; step = 0; selected = null; lastFrom = lastTo = wrongCell = null;
  state = Object.assign({}, PUZZLES[idx].board);
  render();
  document.getElementById('puz-title').textContent = PUZZLES[idx].title;
  setStatus('', 'Trouvez le meilleur coup.');
  hide('btn-restart'); hide('btn-next');
}

function render() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r = 7; r >= 0; r--) {
    for (let c = 0; c < 8; c++) {
      const s = sq(c,r);
      const isLight = (c+r)%2===1;
      const div = document.createElement('div');
      div.className = 'cell '+(isLight?'light':'dark');
      div.id = cid(c,r);
      div.onclick = () => onCellClick(s);
      const piece = state[s];
      if (piece) {
        const span = document.createElement('span');
        span.className = 'piece '+piece[0];   // 'w' or 'b'
        span.textContent = G[piece[1]];
        div.appendChild(span);
      }
      el.appendChild(div);
    }
  }
  if (lastFrom) cell(lastFrom)?.classList.add('last-from');
  if (lastTo)   cell(lastTo)?.classList.add('last-to');
  if (wrongCell) cell(wrongCell)?.classList.add('wrong');
}

function onCellClick(s) {
  const puz = PUZZLES[pidx];
  if (step >= puz.solution.length) return;
  const isPlayerTurn = step % 2 === 0;
  if (!isPlayerTurn) return;

  if (!selected) {
    const piece = state[s];
    if (!piece || piece[0] !== puz.toMove) return;
    selected = s;
    cell(s)?.classList.add('selected');
  } else {
    if (s === selected) {
      cell(s)?.classList.remove('selected');
      selected = null;
      return;
    }
    // Re-select own piece
    const piece = state[s];
    if (piece && piece[0] === puz.toMove) {
      cell(selected)?.classList.remove('selected');
      selected = s;
      cell(s)?.classList.add('selected');
      return;
    }
    // Attempt move
    const correct = puz.solution[step];
    if (selected === correct[0] && s === correct[1]) {
      // Good move
      move(selected, s);
      lastFrom = correct[0]; lastTo = correct[1]; wrongCell = null;
      step++;
      selected = null;
      render();
      if (step >= puz.solution.length) {
        onSolved();
      } else {
        setStatus('think', 'Bon coup…');
        setTimeout(engineMove, 650);
      }
    } else {
      // Wrong move
      wrongCell = s;
      selected = null;
      render();
      setStatus('err', 'Mauvais coup.');
      show('btn-restart');
    }
  }
}

function engineMove() {
  const puz = PUZZLES[pidx];
  if (step >= puz.solution.length) { onSolved(); return; }
  const [from, to] = puz.solution[step];
  move(from, to);
  lastFrom = from; lastTo = to; wrongCell = null;
  step++;
  render();
  if (step >= puz.solution.length) onSolved();
  else setStatus('', 'Trouvez le meilleur coup.');
}

function move(from, to) {
  const piece = state[from];
  delete state[from];
  if (piece==='wP' && to[1]==='8') state[to]='wQ';
  else if (piece==='bP' && to[1]==='1') state[to]='bQ';
  else state[to] = piece;
}

function onSolved() {
  setStatus('ok', 'Excellent !');
  hide('btn-restart');
  if (pidx < PUZZLES.length-1) show('btn-next');
  else setTimeout(()=>document.getElementById('overlay').classList.add('show'), 700);
}

function restartPuzzle() { setup(pidx); }
function nextPuzzle()    { setup(pidx+1); }
function resetAll() {
  document.getElementById('overlay').classList.remove('show');
  setup(0);
}

function setStatus(cls, msg) {
  const el = document.getElementById('status');
  el.className = 'status '+(cls||'');
  el.textContent = msg;
}
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

setup(0);
</script>
</body>
</html>
