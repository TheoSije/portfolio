<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Puzzles — theo.design</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #F5E4CC;
  color: #1C1C2E;
  font-family: 'DM Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: 48px;
  background: #1C1C2E;
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 14px;
}
.nav-back {
  display: flex; align-items: center; gap: 7px;
  color: rgba(255,255,255,.35);
  font-size: 12px; letter-spacing: .04em;
  transition: color .2s; cursor: pointer;
  background: none; border: none;
  font-family: 'DM Sans', sans-serif; padding: 0; text-decoration: none;
}
.nav-back:hover { color: rgba(255,255,255,.75); }
.nav-sep { width: 1px; height: 13px; background: rgba(255,255,255,.12); }
.nav-logo { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.6); }

/* ── IN-IFRAME ── */
body.in-iframe nav { display: none; }
body.in-iframe .main { padding-top: 0; }

/* ── MAIN ── */
.main {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  padding-top: 48px;
  gap: 20px;
}

/* ── BOARD ── */
.board-wrap { user-select: none; position: relative; }

#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  border-radius: 12px;
  overflow: hidden;
  box-shadow:
    0 32px 80px rgba(28,28,46,.18),
    0 6px 20px rgba(28,28,46,.1),
    0 0 0 3px #1C1C2E;
}

.cell {
  width: 68px; height: 68px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative;
  transition: background .12s;
}
.cell.light { background: #EDD9B8; }
.cell.dark  { background: #C8845A; }

.cell.selected  { background: rgba(244,114,182,.55) !important; }
.cell.last-from { background: rgba(244,114,182,.28) !important; }
.cell.last-to   { background: rgba(244,114,182,.45) !important; }
.cell.wrong     { background: rgba(239,68,68,.45)   !important; }

/* ── PIECES ── */
.piece {
  width: 50px; height: 54px;
  pointer-events: none;
  display: block;
  overflow: visible;
}

/* ── INFO ── */
.info {
  display: flex; flex-direction: column;
  align-items: center; gap: 10px; min-height: 80px;
}
.puzzle-title {
  font-size: 15px; font-weight: 700;
  color: #1C1C2E; letter-spacing: .01em;
}
.status { font-size: 13px; color: rgba(28,28,46,.4); transition: color .2s; }
.status.ok    { color: #16a34a; }
.status.err   { color: #ef4444; }
.status.think { color: #d97706; }

.btn-row { display: flex; gap: 10px; margin-top: 2px; }
.btn {
  padding: 9px 20px; border-radius: 8px; border: none;
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .2s;
}
.btn-primary { background: #1C1C2E; color: #F5E4CC; }
.btn-primary:hover { opacity: .82; }
.btn-ghost { background: rgba(28,28,46,.08); color: rgba(28,28,46,.5); }
.btn-ghost:hover { background: rgba(28,28,46,.14); color: #1C1C2E; }
.hidden { display: none !important; }

/* ── END OVERLAY ── */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(245,228,204,.88);
  backdrop-filter: blur(10px);
  z-index: 200;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 14px; text-align: center;
}
.overlay.show { display: flex; }
.overlay-emoji { font-size: 52px; }
.overlay-title { font-size: 26px; font-weight: 700; color: #1C1C2E; }
.overlay-sub   { font-size: 14px; color: rgba(28,28,46,.45); }
.overlay-btn {
  margin-top: 8px; padding: 12px 28px;
  background: #1C1C2E; color: #F5E4CC;
  border: none; border-radius: 10px;
  font-family: inherit; font-size: 14px; font-weight: 600;
  cursor: pointer;
}
.overlay-btn:hover { opacity: .85; }

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  .cell  { width: 44px; height: 44px; }
  .piece { width: 34px; height: 38px; }
}
@media (max-height: 620px) {
  .main { gap: 12px; }
  .cell  { width: 52px; height: 52px; }
  .piece { width: 40px; height: 44px; }
}
</style>
</head>
<body>

<nav>
  <a class="nav-back" href="../" onclick="event.preventDefault();if(window.parent!==window){window.parent.postMessage('close-minisite','*');}else{window.location.href='../';}">← theo.design</a>
  <div class="nav-sep"></div>
  <span class="nav-logo">Chess Puzzles</span>
</nav>

<div class="main">
  <div class="board-wrap">
    <div id="board"></div>
  </div>
  <div class="info">
    <div class="puzzle-title" id="puz-title"></div>
    <div class="status" id="status">Trouvez le meilleur coup.</div>
    <div class="btn-row">
      <button class="btn btn-ghost hidden" id="btn-restart" onclick="restartPuzzle()">Recommencer</button>
      <button class="btn btn-primary hidden" id="btn-next" onclick="nextPuzzle()">Puzzle suivant →</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-emoji">♟</div>
  <div class="overlay-title">Tous les puzzles résolus !</div>
  <div class="overlay-sub">Bravo, tu as tout résolu.</div>
  <button class="overlay-btn" onclick="resetAll()">Recommencer depuis le début</button>
</div>

<script>
/* ═══════════════════════════════════════════════
   PIECE SVG RENDERER  — DA: card chess-card.jpg
   Pink pieces (w) · Navy pieces (b) · hearts everywhere
═══════════════════════════════════════════════ */
function pieceSVG(type, col) {
  const isW  = col === 'w';

  // White → hot pink palette  |  Black → cobalt navy palette
  const fill   = isW ? '#F472B6' : '#3D51D8';
  const dark   = isW ? '#BE185D' : '#1E2E90';
  const light  = isW ? '#FCA5D3' : '#818CF8';
  const accent = '#EF4444';          // red-orange (crowns, hearts)
  const green  = '#22C55E';
  const yellow = '#EAB308';
  const ring1  = isW ? accent : green;   // top accent ring
  const ring2  = isW ? '#F97316' : yellow; // bottom accent ring

  // Shared helpers
  const base = `<ellipse cx="20" cy="47" rx="14" ry="5" fill="${fill}" stroke="${dark}" stroke-width="1.8"/>
    <rect x="6" y="43" width="28" height="5" rx="2.5" fill="${ring1}" stroke="${dark}" stroke-width="1.2"/>`;

  const heart = (x, y, size = 9) =>
    `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" fill="${accent}" font-family="serif">♥</text>`;

  const shapes = {

    /* ── PAWN ── */
    P: `
      <circle cx="20" cy="13" r="9" fill="${fill}" stroke="${dark}" stroke-width="1.8"/>
      ${heart(20, 17, 8)}
      <ellipse cx="20" cy="23" rx="7" ry="4" fill="${light}" stroke="${dark}" stroke-width="1.2"/>
      <ellipse cx="20" cy="33" rx="11" ry="8" fill="${fill}" stroke="${dark}" stroke-width="1.8"/>
      ${base}
    `,

    /* ── ROOK ── */
    R: `
      <rect x="7"  y="6" width="8" height="12" rx="2.5" fill="${fill}" stroke="${dark}" stroke-width="1.8"/>
      <rect x="16" y="6" width="8" height="12" rx="2.5" fill="${fill}" stroke="${dark}" stroke-width="1.8"/>
      <rect x="25" y="6" width="8" height="12" rx="2.5" fill="${fill}" stroke="${dark}" stroke-width="1.8"/>
      <rect x="8" y="15" width="24" height="28" rx="3" fill="${fill}" stroke="${dark}" stroke-width="1.8"/>
      <rect x="7" y="27" width="26" height="4" rx="2" fill="${light}" stroke="${dark}" stroke-width="1"/>
      ${heart(20, 35)}
      ${base}
    `,

    /* ── KNIGHT ── */
    N: `
      <path d="M 10 46 C 10 38 11 30 14 24 C 12 20 11 14 14 10 C 16 6 20 4 25 5
               C 30 6 33 11 31 16 C 34 18 35 24 32 30 L 28 40 L 10 46 Z"
            fill="${fill}" stroke="${dark}" stroke-width="1.8" stroke-linejoin="round"/>
      <ellipse cx="24" cy="11" rx="3.5" ry="2.5" fill="${dark}" opacity=".7"/>
      <circle cx="27" cy="9" r="2" fill="${fill}" stroke="${dark}" stroke-width="1"/>
      <rect x="7" y="38" width="26" height="4" rx="2" fill="${light}" stroke="${dark}" stroke-width="1"/>
      ${heart(18, 32, 8)}
      ${base}
    `,

    /* ── BISHOP ── */
    B: `
      <circle cx="20" cy="6" r="5" fill="${ring2}" stroke="${dark}" stroke-width="1.5"/>
      <path d="M 20 10 L 28 30 L 12 30 Z" fill="${fill}" stroke="${dark}" stroke-width="1.8" stroke-linejoin="round"/>
      <ellipse cx="20" cy="22" rx="5" ry="4" fill="${light}" stroke="${dark}" stroke-width="1"/>
      <ellipse cx="20" cy="37" rx="12" ry="8" fill="${fill}" stroke="${dark}" stroke-width="1.8"/>
      ${heart(20, 40, 8)}
      ${base}
    `,

    /* ── QUEEN ── (matches card: crown balls + hearts all over) */
    Q: `
      <circle cx="7"  cy="14" r="4.5" fill="${accent}" stroke="${dark}" stroke-width="1.5"/>
      <circle cx="13" cy="8"  r="4.5" fill="${accent}" stroke="${dark}" stroke-width="1.5"/>
      <circle cx="20" cy="6"  r="5.5" fill="${accent}" stroke="${dark}" stroke-width="1.5"/>
      <circle cx="27" cy="8"  r="4.5" fill="${accent}" stroke="${dark}" stroke-width="1.5"/>
      <circle cx="33" cy="14" r="4.5" fill="${accent}" stroke="${dark}" stroke-width="1.5"/>
      <path d="M 6 18 L 9 28 L 31 28 L 34 18 Z" fill="${fill}" stroke="${dark}" stroke-width="1.8" stroke-linejoin="round"/>
      <rect x="7" y="26" width="26" height="5" rx="2.5" fill="${light}" stroke="${dark}" stroke-width="1.2"/>
      <path d="M 9 30 C 7 37 7 42 9 47 L 31 47 C 33 42 33 37 31 30 Z"
            fill="${fill}" stroke="${dark}" stroke-width="1.8"/>
      ${heart(13, 39, 8)}
      ${heart(27, 39, 8)}
      ${heart(20, 44, 8)}
      ${base}
    `,

    /* ── KING ── (matches card: cross + colored rings) */
    K: `
      <rect x="17" y="2" width="6" height="18" rx="3" fill="${ring2}" stroke="${dark}" stroke-width="1.5"/>
      <rect x="11" y="7" width="18" height="7"  rx="3" fill="${ring2}" stroke="${dark}" stroke-width="1.5"/>
      <rect x="7"  y="19" width="26" height="5" rx="2.5" fill="${ring1}" stroke="${dark}" stroke-width="1.2"/>
      <path d="M 9 23 C 7 31 7 40 9 47 L 31 47 C 33 40 33 31 31 23 Z"
            fill="${fill}" stroke="${dark}" stroke-width="1.8"/>
      <rect x="7" y="30" width="26" height="4" rx="2" fill="${ring1}" stroke="${dark}" stroke-width="1"/>
      <rect x="7" y="36" width="26" height="3" rx="1.5" fill="${ring2}" stroke="${dark}" stroke-width="1"/>
      ${heart(13, 46, 8)}
      ${heart(27, 46, 8)}
      ${base}
    `,
  };

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 52"
    width="100%" height="100%" overflow="visible">${shapes[type] || ''}</svg>`;
}

/* ═══════════════════════════════════════════════
   PUZZLES
═══════════════════════════════════════════════ */
const PUZZLES = [
  {
    title: "Mat en 1 — Tour",
    toMove: 'w',
    board: { a7:'wR', b3:'bR', b6:'bR', d7:'wR', g4:'wK', g5:'bP', g8:'bK' },
    solution: [["d7","d8"]],
  },
  {
    title: "Mat en 1 — Capture",
    toMove: 'b',
    board: { a1:'wR', a2:'wP', a7:'bP', a8:'bR', b1:'wN', b2:'wP', b7:'bP', b8:'bN', c1:'wB', c2:'wP', c5:'bB', c8:'bB', d3:'wQ', d5:'bP', e4:'bQ', e5:'wP', e8:'bK', f1:'wB', f3:'wN', g2:'wP', g3:'wK', g7:'bP', g8:'bN', h1:'wR', h2:'wP', h7:'bP', h8:'bR' },
    solution: [["e4","g4"]],
  },
  {
    title: "Mat en 1 — Attaque f2",
    toMove: 'b',
    board: { a1:'wR', a2:'wP', a7:'bP', a8:'bR', b2:'wP', b7:'bP', b8:'bN', c1:'wB', c2:'wP', c3:'wN', c5:'bB', c8:'bB', d1:'wQ', e1:'wK', e6:'wP', e8:'bK', f1:'wB', f2:'wP', f6:'bQ', f7:'bP', g1:'wN', g2:'wP', g7:'bP', g8:'bN', h1:'wR', h2:'wP', h7:'bP', h8:'bR' },
    solution: [["f6","f2"]],
  },
  {
    title: "Mat en 2",
    toMove: 'w',
    board: { b3:'wP', b8:'bR', c4:'wP', c5:'bP', c7:'bQ', d4:'bP', d7:'bN', e4:'wP', f1:'wR', f4:'wR', f6:'wP', f7:'bP', g1:'wK', g2:'wB', g6:'bP', g8:'bR', h3:'wP', h6:'wQ', h7:'bP', h8:'bK' },
    solution: [["h6","h7"], ["h8","h7"], ["f4","h4"]],
  },
  {
    title: "Mat en 2 — Couloir",
    toMove: 'w',
    board: { a2:'wP', a7:'bP', b5:'bP', c3:'bQ', c6:'bP', e5:'wP', f5:'bB', f6:'wQ', f7:'bP', g1:'wK', g3:'wP', g6:'bP', h2:'wP', h6:'bK' },
    solution: [["f6","h8"], ["h6","g5"], ["h8","h4"]],
  },
  {
    title: "Mat en 2 — Avantage",
    toMove: 'w',
    board: { a1:'wR', a2:'wP', a7:'bP', b2:'wP', b7:'bP', c1:'wB', c3:'wP', c7:'bP', c8:'bB', d1:'wQ', d3:'wP', d5:'bP', d8:'bQ', e5:'wR', f2:'wP', f6:'bB', g1:'wK', g2:'wP', h3:'wP', h7:'bK', h8:'bR' },
    solution: [["d1","h5"], ["h7","g8"], ["e5","e8"], ["d8","e8"], ["h5","e8"]],
  },
  {
    title: "Fourchette",
    toMove: 'b',
    board: { b4:'bP', c6:'bK', d4:'wP', d5:'bP', d6:'wP', e3:'wK', e4:'bP', f1:'wR', f5:'wP', f6:'bB', f7:'bR', g3:'wP', g4:'bP', h6:'wR' },
    solution: [["f6","g5"], ["e3","e2"], ["g5","h6"]],
  },
  {
    title: "Clouage",
    toMove: 'b',
    board: { a1:'wR', a2:'wP', b2:'wP', b3:'wB', b6:'bP', b7:'bB', c2:'wP', d3:'wP', d4:'bN', d6:'bN', d7:'bP', d8:'bK', e1:'wK', e3:'wB', e5:'wQ', f2:'wP', f3:'wN', f5:'bP', f6:'bQ', f8:'bB', g2:'wP', g6:'bP', h1:'wR', h2:'wP', h6:'bP', h8:'bR' },
    solution: [["d4","f3"], ["g2","f3"], ["f6","e5"]],
  },
  {
    title: "Fourchette — Avantage",
    toMove: 'b',
    board: { a1:'wR', a3:'wP', a7:'bP', b2:'wP', b7:'bP', c2:'wK', c3:'wN', d2:'wB', d3:'wQ', d4:'wP', d5:'bP', d7:'bN', e3:'wP', e6:'bP', f2:'bR', f8:'bR', g2:'bQ', g6:'bP', g7:'bP', g8:'bK', h1:'wR' },
    solution: [["f2","d2"], ["d3","d2"], ["f8","f2"], ["d2","f2"], ["g2","f2"]],
  },
  {
    title: "Clouage — Sacrifice",
    toMove: 'b',
    board: { a1:'wR', a2:'wP', a5:'bB', a7:'bP', a8:'bR', b2:'wP', b7:'bP', c3:'wP', c4:'wB', c7:'bP', d4:'bN', d5:'wN', d8:'bQ', e1:'wK', e7:'wB', f2:'wP', f3:'wQ', f5:'bB', f8:'bK', g2:'wP', h1:'wR', h2:'wP', h7:'bP', h8:'bR' },
    solution: [["d8","e7"], ["d5","e7"], ["d4","f3"]],
  },
];

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let pidx = 0, state = {}, selected = null, step = 0;
let lastFrom = null, lastTo = null, wrongCell = null;

function sq(c,r)  { return String.fromCharCode(97+c)+(r+1); }
function col(s)   { return s.charCodeAt(0)-97; }
function row(s)   { return parseInt(s[1])-1; }
function cid(c,r) { return 'c'+c+r; }
function cell(s)  { return document.getElementById(cid(col(s),row(s))); }

function setup(idx) {
  pidx = idx; step = 0; selected = null; lastFrom = lastTo = wrongCell = null;
  state = Object.assign({}, PUZZLES[idx].board);
  render();
  document.getElementById('puz-title').textContent = PUZZLES[idx].title;
  setStatus('', 'Trouvez le meilleur coup.');
  hide('btn-restart'); hide('btn-next');
}

function render() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r = 7; r >= 0; r--) {
    for (let c = 0; c < 8; c++) {
      const s = sq(c,r);
      const isLight = (c+r)%2===1;
      const div = document.createElement('div');
      div.className = 'cell '+(isLight?'light':'dark');
      div.id = cid(c,r);
      div.onclick = () => onCellClick(s);
      const piece = state[s];
      if (piece) {
        const svg = document.createElement('div');
        svg.className = 'piece';
        svg.innerHTML = pieceSVG(piece[1], piece[0]);
        div.appendChild(svg);
      }
      el.appendChild(div);
    }
  }
  if (lastFrom) cell(lastFrom)?.classList.add('last-from');
  if (lastTo)   cell(lastTo)?.classList.add('last-to');
  if (wrongCell) cell(wrongCell)?.classList.add('wrong');
}

function onCellClick(s) {
  const puz = PUZZLES[pidx];
  if (step >= puz.solution.length) return;
  const isPlayerTurn = step % 2 === 0;
  if (!isPlayerTurn) return;

  if (!selected) {
    const piece = state[s];
    if (!piece || piece[0] !== puz.toMove) return;
    selected = s;
    cell(s)?.classList.add('selected');
  } else {
    if (s === selected) {
      cell(s)?.classList.remove('selected');
      selected = null;
      return;
    }
    const piece = state[s];
    if (piece && piece[0] === puz.toMove) {
      cell(selected)?.classList.remove('selected');
      selected = s;
      cell(s)?.classList.add('selected');
      return;
    }
    const correct = puz.solution[step];
    if (selected === correct[0] && s === correct[1]) {
      move(selected, s);
      lastFrom = correct[0]; lastTo = correct[1]; wrongCell = null;
      step++; selected = null;
      render();
      if (step >= puz.solution.length) {
        onSolved();
      } else {
        setStatus('think', 'Bon coup…');
        setTimeout(engineMove, 650);
      }
    } else {
      wrongCell = s; selected = null;
      render();
      setStatus('err', 'Mauvais coup.');
      show('btn-restart');
    }
  }
}

function engineMove() {
  const puz = PUZZLES[pidx];
  if (step >= puz.solution.length) { onSolved(); return; }
  const [from, to] = puz.solution[step];
  move(from, to);
  lastFrom = from; lastTo = to; wrongCell = null;
  step++;
  render();
  if (step >= puz.solution.length) onSolved();
  else setStatus('', 'Trouvez le meilleur coup.');
}

function move(from, to) {
  const piece = state[from];
  delete state[from];
  if (piece==='wP' && to[1]==='8') state[to]='wQ';
  else if (piece==='bP' && to[1]==='1') state[to]='bQ';
  else state[to] = piece;
}

function onSolved() {
  setStatus('ok', 'Excellent !');
  hide('btn-restart');
  if (pidx < PUZZLES.length-1) show('btn-next');
  else setTimeout(()=>document.getElementById('overlay').classList.add('show'), 700);
}

function restartPuzzle() { setup(pidx); }
function nextPuzzle()    { setup(pidx+1); }
function resetAll() {
  document.getElementById('overlay').classList.remove('show');
  setup(0);
}

function setStatus(cls, msg) {
  const el = document.getElementById('status');
  el.className = 'status '+(cls||'');
  el.textContent = msg;
}
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

if (window.self !== window.top) document.body.classList.add('in-iframe');
setup(0);
</script>
</body>
</html>
