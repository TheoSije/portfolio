<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkpt — theo.design</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #0a0a0a;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: 48px;
  background: #000;
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 14px;
}

.nav-back {
  display: flex;
  align-items: center;
  gap: 7px;
  color: rgba(255,255,255,.32);
  font-size: 12px;
  letter-spacing: .04em;
  transition: color .2s;
  cursor: pointer;
  background: none;
  border: none;
  font-family: 'DM Sans', sans-serif;
  padding: 0;
  text-decoration: none;
}
.nav-back:hover { color: rgba(255,255,255,.7); }
.nav-sep { width: 1px; height: 13px; background: rgba(255,255,255,.1); }
.nav-logo { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.65); }
.nav-right {
  margin-left: auto;
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(255,255,255,.14);
}

main {
  height: 100vh;
  padding-top: 48px;
  padding-bottom: 80px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding-left: clamp(28px, 6vw, 88px);
  padding-right: clamp(28px, 6vw, 88px);
}

.quote-block {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  max-width: 860px;
}

.quote-mark {
  font-family: 'Playfair Display', serif;
  font-size: clamp(60px, 10vw, 110px);
  line-height: .85;
  margin-bottom: 8px;
  display: block;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .4s ease, transform .4s ease, color 1.8s ease;
}

.quote-text {
  font-family: 'Playfair Display', serif;
  font-size: clamp(30px, 4.8vw, 72px);
  font-weight: 800;
  line-height: 1.12;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity .4s ease .07s, transform .4s ease .07s, color 1.8s ease;
}

.quote-author {
  margin-top: 32px;
  font-size: clamp(12px, 1.3vw, 15px);
  font-weight: 400;
  color: rgba(255,255,255,.45);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .4s ease .14s, transform .4s ease .14s;
  letter-spacing: .03em;
}

.quote-block.visible .quote-mark,
.quote-block.visible .quote-text,
.quote-block.visible .quote-author {
  opacity: 1;
  transform: translateY(0);
}

/* ── BOTTOM BAR ── */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px clamp(28px, 6vw, 88px) 24px;
  background: #000;
  border-top: 1px solid rgba(255,255,255,.08);
  gap: 12px;
}

.counter {
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(255,255,255,.16);
  flex-shrink: 0;
}

.controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ── GLASS BUTTONS ── */
.glass-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  box-shadow:
    0 0 0 0.5px rgba(255,255,255,0.14),
    inset 0 1px 0 rgba(255,255,255,0.18),
    0 4px 16px rgba(0,0,0,0.28);
  color: rgba(255,255,255,.7);
  font-size: 17px;
  transition: background .22s ease, box-shadow .22s ease, transform .2s cubic-bezier(0.34,1.56,0.64,1);
  flex-shrink: 0;
}
.glass-btn:hover {
  background: rgba(255,255,255,0.14);
  box-shadow:
    0 0 0 0.5px rgba(255,255,255,0.22),
    inset 0 1px 0 rgba(255,255,255,0.26),
    0 8px 24px rgba(0,0,0,0.35);
  color: #fff;
  transform: scale(1.07);
}
.glass-btn:active { transform: scale(0.93); }


/* ── SHARE MODAL ── */
.share-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0 0 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease;
}
.share-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.share-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.share-sheet {
  position: relative;
  z-index: 1;
  width: min(520px, calc(100% - 32px));
  background: rgba(36,34,34,0.96);
  backdrop-filter: blur(32px);
  -webkit-backdrop-filter: blur(32px);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 24px 80px rgba(0,0,0,.6);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  transform: translateY(24px);
  transition: transform .35s cubic-bezier(0.34,1.2,0.64,1);
}
.share-overlay.open .share-sheet {
  transform: translateY(0);
}

.share-preview-wrap {
  display: flex;
  justify-content: center;
}
#share-canvas {
  border-radius: 12px;
  display: block;
  max-width: 100%;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
}

.share-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.share-label {
  font-size: 9px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(255,255,255,.3);
}
.share-options {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.share-opt {
  height: 32px;
  padding: 0 14px;
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,.12);
  background: none;
  color: rgba(255,255,255,.5);
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  cursor: pointer;
  transition: all .15s;
}
.share-opt:hover { border-color: rgba(255,255,255,.3); color: rgba(255,255,255,.85); }
.share-opt.active {
  background: rgba(255,255,255,.12);
  border-color: rgba(255,255,255,.35);
  color: #fff;
}

.share-color-opts {
  display: flex;
  gap: 8px;
}
.share-color-swatch {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform .15s, border-color .15s;
  flex-shrink: 0;
}
.share-color-swatch:hover { transform: scale(1.12); }
.share-color-swatch.active { border-color: #fff; }

.share-actions {
  display: flex;
  gap: 10px;
}
.share-dl-btn {
  flex: 1;
  height: 42px;
  border-radius: 100px;
  border: none;
  background: #fff;
  color: #111;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  cursor: pointer;
  transition: opacity .15s;
}
.share-dl-btn:hover { opacity: .88; }
.share-close-btn {
  height: 42px;
  padding: 0 18px;
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,.12);
  background: none;
  color: rgba(255,255,255,.5);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
}
.share-close-btn:hover { color: #fff; border-color: rgba(255,255,255,.3); }

@media (max-width: 600px) {
  nav { padding: 0 16px; }
  .nav-right { display: none; }
  main { padding-left: 20px; padding-right: 20px; }
  .glass-btn { width: 40px; height: 40px; font-size: 15px; }
}

/* Dans l'iframe portfolio : le nav portfolio gère déjà la barre du haut */
body.in-iframe nav { display: none; }
body.in-iframe main { padding-top: 0; }
</style>
</head>

</main>

<div class="share-overlay" id="share-overlay">

        <button class="share-opt" data-fmt="wide" onclick="setFmt(this)">Paysage</button>
      </div>
    </div>

    <div class="share-row">
      <span class="share-label">Couleur</span>
      <div class="share-color-opts" id="color-opts">
        <div class="share-color-swatch active" style="background:#111" data-idx="0" onclick="setColor(this)"></div>
        <div class="share-color-swatch" style="background:#0f172a" data-idx="1" onclick="setColor(this)"></div>
        <div class="share-color-swatch" style="background:#1a0a2e" data-idx="2" onclick="setColor(this)"></div>
        <div class="share-color-swatch" style="background:#f5f0e8" data-idx="3" onclick="setColor(this)"></div>
      </div>
    </div>

    <div class="share-actions">
      <button class="share-dl-btn" onclick="downloadCard()">↓ Télécharger</button>
      <button class="share-close-btn" onclick="closeShare()">Annuler</button>
    </div>
  </div>
</div>

// ── COLOR PALETTE (smooth, muted tones) ──
const colorPalette = [
  { from: '#e8d5b7', to: '#c9a87c' },   // warm sand
  { from: '#b8cce4', to: '#8aafd4' },   // soft blue
  { from: '#c8e6c9', to: '#88c98a' },   // sage green
  { from: '#f5c6d0', to: '#e8929e' },   // dusty rose
  { from: '#d4c5e2', to: '#b39dcc' },   // lavender
  { from: '#fde68a', to: '#e8c547' },   // warm yellow
  { from: '#b2dfdb', to: '#7cbfb9' },   // teal
  { from: '#ffccbc', to: '#e8a080' },   // peach
  { from: '#cfd8dc', to: '#96adb7' },   // blue grey
  { from: '#d7ccc8', to: '#b5a09c' },   // warm grey
  { from: '#c5e1a5', to: '#93c464' },   // lime
  { from: '#ffe0b2', to: '#e8b366' },   // amber
  { from: '#f8bbd0', to: '#e880a8' },   // pink
  { from: '#b3e5fc', to: '#72c9f5' },   // sky
  { from: '#e1bee7', to: '#c490d1' },   // lilac
];

let current = 0;
let currentColorIdx = 0;

const block   = document.getElementById('quote-block');
const markEl  = document.getElementById('quote-mark');
const textEl  = document.getElementById('quote-text');
const authorEl= document.getElementById('quote-author');
const counterEl = document.getElementById('counter');

function pad(n) { return String(n).padStart(2, '0'); }

function applyColor(idx) {
  const c = colorPalette[idx % colorPalette.length];
  const grad = `linear-gradient(135deg, ${c.from} 0%, ${c.to} 100%)`;
  markEl.style.background = grad;
  markEl.style.webkitBackgroundClip = 'text';
  markEl.style.webkitTextFillColor = 'transparent';
  markEl.style.backgroundClip = 'text';
  textEl.style.background = grad;
  textEl.style.webkitBackgroundClip = 'text';
  textEl.style.webkitTextFillColor = 'transparent';
  textEl.style.backgroundClip = 'text';
}

function show(idx, direction) {
  block.classList.remove('visible');
  setTimeout(() => {
    textEl.textContent = quotes[idx].text;
    authorEl.textContent = quotes[idx].author;
    counterEl.textContent = pad(idx + 1) + ' / ' + pad(quotes.length);
    currentColorIdx = idx % colorPalette.length;
    applyColor(currentColorIdx);
    block.classList.add('visible');
  }, 280);
}

function next() { current = (current + 1) % quotes.length; show(current, 1); }
function prev() { current = (current - 1 + quotes.length) % quotes.length; show(current, -1); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prev();
});

// ── SHARE ──
const FORMATS = {
  square: { w: 1080, h: 1080, label: 'Carré' },
  story:  { w: 1080, h: 1920, label: 'Story' },
  wide:   { w: 1920, h: 1080, label: 'Paysage' },
};
const CARD_COLORS = [
  { bg: '#111',    sub: 'rgba(255,255,255,.42)', brand: 'rgba(255,255,255,.18)' },
  { bg: '#0f172a', sub: 'rgba(255,255,255,.42)', brand: 'rgba(255,255,255,.18)' },
  { bg: '#1a0a2e', sub: 'rgba(255,255,255,.42)', brand: 'rgba(255,255,255,.18)' },
  { bg: '#f5f0e8', sub: 'rgba(0,0,0,.38)',       brand: 'rgba(0,0,0,.16)' },
];

let shareFmt = 'square';
let shareColorIdx = 0;
const canvas = document.getElementById('share-canvas');
const ctx = canvas.getContext('2d');

function renderCanvas() {
  const fmt = FORMATS[shareFmt];
  const col = CARD_COLORS[shareColorIdx];
  const c = colorPalette[currentColorIdx];

  // Responsive preview: fit inside 440×320 while keeping aspect ratio
  const maxPW = 440, maxPH = 320;
  const displayScale = Math.min(maxPW / fmt.w, maxPH / fmt.h);
  canvas.width  = fmt.w;
  canvas.height = fmt.h;
  canvas.style.width  = Math.round(fmt.w * displayScale) + 'px';
  canvas.style.height = Math.round(fmt.h * displayScale) + 'px';

  const W = fmt.w, H = fmt.h;
  // Base all sizes on the shorter dimension so square/story/wide are consistent
  const base = Math.min(W, H);
  const pad  = base * 0.1;

  // ── BG ──
  ctx.fillStyle = col.bg;
  ctx.fillRect(0, 0, W, H);

  // Soft gradient blob top-left
  const grd = ctx.createRadialGradient(W * 0.18, H * 0.2, 0, W * 0.18, H * 0.2, base * 0.55);
  grd.addColorStop(0, hexAlpha(c.from, 0.2));
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // ── SIZES ──
  const qMarkSize = base * 0.15;
  const textSize  = Math.min(base * 0.065, 88);
  const authorSize= Math.max(base * 0.024, 22);
  const brandSize = Math.max(base * 0.020, 18);
  const lineH     = textSize * 1.22;
  const maxTextW  = W - pad * 2;

  // Pre-measure text wrapping to vertically center the block
  ctx.font = `800 ${textSize}px 'Georgia', serif`;
  const words = quotes[current].text.split(' ');
  let line = '', lines = [];
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxTextW && line) { lines.push(line); line = w; }
    else line = test;
  }
  lines.push(line);

  const blockH = qMarkSize * 0.85 + 16 + lines.length * lineH + authorSize * 1.8;
  const startY = (H - blockH) / 2;

  // ── QUOTE MARK ──
  ctx.font = `800 ${qMarkSize}px 'Georgia', serif`;
  ctx.fillStyle = c.from;
  ctx.globalAlpha = 0.82;
  ctx.fillText('\u201C', pad, startY + qMarkSize * 0.85);
  ctx.globalAlpha = 1;

  // ── QUOTE TEXT (gradient) ──
  const tGrad = ctx.createLinearGradient(pad, 0, Math.min(W - pad, pad + maxTextW), 0);
  tGrad.addColorStop(0, c.from);
  tGrad.addColorStop(1, c.to);
  ctx.fillStyle = tGrad;
  ctx.font = `800 ${textSize}px 'Georgia', serif`;
  const textY = startY + qMarkSize * 0.85 + 16 + textSize;
  lines.forEach((l, i) => ctx.fillText(l, pad, textY + i * lineH));

  // ── AUTHOR ──
  const authorY = textY + lines.length * lineH + authorSize * 0.6;
  ctx.font = `400 ${authorSize}px 'DM Sans', sans-serif`;
  ctx.fillStyle = col.sub;
  ctx.fillText(quotes[current].author, pad, authorY);

  // ── BRAND (bottom right) ──
  ctx.font = `500 ${brandSize}px 'DM Sans', sans-serif`;
  ctx.fillStyle = col.brand;
  ctx.textAlign = 'right';
  ctx.fillText('inkpt \u00B7 theo.design', W - pad * 0.55, H - pad * 0.5);
  ctx.textAlign = 'left';
}

function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function openShare() {
  renderCanvas();
  document.getElementById('share-overlay').classList.add('open');
}
function closeShare() {
  document.getElementById('share-overlay').classList.remove('open');
}

function setFmt(btn) {
  shareFmt = btn.dataset.fmt;
  document.querySelectorAll('#fmt-opts .share-opt').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCanvas();
}

function setColor(el) {
  shareColorIdx = +el.dataset.idx;
  document.querySelectorAll('.share-color-swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  renderCanvas();
}

function downloadCard() {
  const link = document.createElement('a');
  link.download = 'inkpt-' + (current + 1) + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

current = Math.floor(Math.random() * quotes.length);
show(current);

// Détection iframe : cache le nav inkpt (le portfolio gère déjà la barre du haut)
if (window.self !== window.top) document.body.classList.add('in-iframe');
</script>
