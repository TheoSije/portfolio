<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #05050a;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── CANVAS BG ── */
#bg-canvas {
  position: fixed; inset: 0;
  z-index: 0; pointer-events: none;
}

/* ── GRAIN ── */
.grain {
  position: fixed; inset: -50%; width: 200%; height: 200%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: 0.045;
  animation: grain .7s steps(1) infinite;
  z-index: 1; pointer-events: none;
}
@keyframes grain {
  0%   { transform: translate(0,0); }
  14%  { transform: translate(-3%,-2%); }
  28%  { transform: translate(2%, 3%); }
  42%  { transform: translate(-1%, 4%); }
  57%  { transform: translate(3%,-1%); }
  71%  { transform: translate(-2%, 2%); }
  85%  { transform: translate(4%,-3%); }
}

/* ── VIGNETTE ── */
.vignette {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0,0,0,.72) 100%);
  z-index: 2; pointer-events: none;
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0;
  height: 52px; z-index: 50;
  display: flex; align-items: center; padding: 0 28px; gap: 14px;
  background: linear-gradient(to bottom, rgba(0,0,0,.45), transparent);
}
.nav-back {
  display: flex; align-items: center; gap: 6px;
  color: rgba(255,255,255,.28); font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  transition: color .2s; cursor: pointer;
  background: none; border: none; padding: 0; text-decoration: none;
}
.nav-back:hover { color: rgba(255,255,255,.62); }
.nav-sep { width: 1px; height: 11px; background: rgba(255,255,255,.1); }
.nav-title {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: rgba(255,255,255,.28);
}

/* ── COUNTER top-right ── */
.film-counter {
  position: fixed; top: 0; right: 28px;
  height: 52px; z-index: 50;
  display: flex; align-items: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: rgba(255,255,255,.18);
  transition: opacity .3s;
}

/* ── MAIN ── */
main {
  position: relative; z-index: 10;
  height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px clamp(24px, 6vw, 80px) 96px;
}

.film-block {
  display: flex; flex-direction: column; align-items: center;
  text-align: center; width: 100%; max-width: 800px;
}

/* Emojis */
.film-emojis {
  font-size: clamp(52px, 14vw, 104px);
  line-height: 1.1; letter-spacing: .06em;
  user-select: none; cursor: default;
  opacity: 0; transform: translateY(18px) scale(.95);
  transition: opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1);
  filter: drop-shadow(0 2px 32px rgba(255,255,255,.06));
}
.film-block.visible .film-emojis { opacity: 1; transform: translateY(0) scale(1); }

/* Separator line */
.film-sep {
  width: 28px; height: 1px;
  background: rgba(255,255,255,.15);
  margin: 44px 0 40px;
  opacity: 0; transform: scaleX(0);
  transition: opacity .4s ease .25s, transform .5s cubic-bezier(.16,1,.3,1) .25s;
}
.film-block.visible .film-sep { opacity: 1; transform: scaleX(1); }

/* Answer zone */
.film-answer {
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  min-height: 100px;
}

/* Title — Bebas Neue */
.film-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(38px, 8.5vw, 80px);
  letter-spacing: .07em; line-height: .95;
  color: #fff;
  opacity: 0; transform: translateY(22px);
  transition: opacity .55s cubic-bezier(.16,1,.3,1), transform .55s cubic-bezier(.16,1,.3,1);
  pointer-events: none;
  text-shadow: 0 0 60px rgba(255,255,255,.12);
}
.film-title.revealed { opacity: 1; transform: translateY(0); }

/* Hint — DM Mono */
.film-hint {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: rgba(255,255,255,.22);
  opacity: 0; transform: translateY(6px);
  transition: opacity .45s ease .14s, transform .45s ease .14s;
}
.film-hint.revealed { opacity: 1; transform: translateY(0); }

/* ── PROGRESS BAR ── */
.auto-bar {
  position: fixed; bottom: 88px; left: 0; right: 0; z-index: 50;
  height: 1px; background: rgba(255,255,255,.05); display: none;
}
.auto-bar.visible { display: block; }
.auto-bar-fill { height: 100%; background: rgba(255,255,255,.22); width: 0%; }

/* ── BOTTOM BAR ── */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  height: 88px;
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 clamp(20px, 5vw, 48px) 16px;
  background: linear-gradient(to top, rgba(0,0,0,.55), transparent);
}

.mode-pill {
  justify-self: start;
  height: 30px; padding: 0 13px; border-radius: 100px;
  border: 1px solid rgba(255,255,255,.13); background: rgba(255,255,255,.04);
  color: rgba(255,255,255,.38); font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
  cursor: pointer; transition: color .2s, border-color .2s, background .2s;
  white-space: nowrap; backdrop-filter: blur(10px);
}
.mode-pill:hover { color: rgba(255,255,255,.75); border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.07); }
.mode-pill.play-active { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.28); }

.nav-controls { display: flex; align-items: center; gap: 18px; }

.arrow-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: none; background: none;
  color: rgba(255,255,255,.28); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color .18s, transform .18s; padding: 0;
}
.arrow-btn:hover { color: rgba(255,255,255,.78); transform: scale(1.1); }
.arrow-btn:active { transform: scale(.9); }

.center-btn {
  width: 52px; height: 52px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06);
  color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .18s, border-color .18s, transform .22s cubic-bezier(.34,1.56,.64,1);
  padding: 0; backdrop-filter: blur(14px);
}
.center-btn:hover { background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.42); transform: scale(1.07); }
.center-btn:active { transform: scale(.93); }
.center-btn.reveal-pulse { border-color: rgba(255,255,255,.42); background: rgba(255,255,255,.09); }

.share-zone { justify-self: end; }
.share-icon-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: none; background: none;
  color: rgba(255,255,255,.26); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: color .2s, transform .18s, opacity .3s;
}
.share-icon-btn.visible { opacity: 1; pointer-events: auto; }
.share-icon-btn:hover { color: rgba(255,255,255,.82); transform: scale(1.12); }
.share-icon-btn:active { transform: scale(.9); }
.share-icon-btn.copied { color: rgba(120,255,160,.82); }

@media (max-width:600px) {
  nav, .film-counter { padding: 0 16px; }
  .film-counter { right: 16px; }
  main { padding-left: 20px; padding-right: 20px; }
  .bottom-bar { padding: 0 16px 16px; }
}

body.in-iframe nav { display: none; }
body.in-iframe .film-counter { top: 4px; }
body.in-iframe main { padding-top: 16px; }
</style>

<script>
// ── DATA — color = RGB glow per film ──────────────────────────────────────

  { emojis:'🦸🦸‍♀️🦸‍♂️💥',    title:'Les Indestructibles',       hint:'Brad Bird · 2004',           color:[162, 18,  8]  },

// ── SHUFFLE ────────────────────────────────────────────────────────────────
for (let i = films.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [films[i], films[j]] = [films[j], films[i]];
}

// ── CANVAS BG ────────────────────────────────────────────────────────────
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');
let   targetRGB  = [18, 18, 48];
let   currentRGB = [18, 18, 48];
let   time = 0;

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function lerp(a, b, t) { return a + (b - a) * t; }

function drawFrame() {
  time += 0.006;
  currentRGB = currentRGB.map((c, i) => lerp(c, targetRGB[i], 0.022));

  const [r, g, b] = currentRGB;
  const W = canvas.width, H = canvas.height;

  // Base deep dark
  ctx.fillStyle = '#05050a';
  ctx.fillRect(0, 0, W, H);

  // Main central glow — drifts slightly
  const ox = Math.sin(time * .7) * W * .04;
  const oy = Math.cos(time * .5) * H * .04;
  const cx = W * .5 + ox, cy = H * .44 + oy;
  const rad = Math.max(W, H) * .72;
  const g1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
  g1.addColorStop(0,   `rgba(${r},${g},${b},.22)`);
  g1.addColorStop(.35, `rgba(${r},${g},${b},.09)`);
  g1.addColorStop(1,   `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, W, H);

  // Secondary smaller glow — offset
  const cx2 = W * .5 - ox * .5, cy2 = H * .56 - oy * .5;
  const rad2 = Math.max(W, H) * .38;
  const g2 = ctx.createRadialGradient(cx2, cy2, 0, cx2, cy2, rad2);
  g2.addColorStop(0,   `rgba(${r},${g},${b},.1)`);
  g2.addColorStop(1,   `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(drawFrame);
}
drawFrame();

// ── GAME LOGIC ────────────────────────────────────────────────────────────
let current = 0, mode = 'discover', isRevealed = false;
let autoTimer = null, isPaused = false;
const REVEAL_DELAY = 3000, NEXT_DELAY = 2500;

const block      = document.getElementById('film-block');
const emojisEl   = document.getElementById('film-emojis');
const titleEl    = document.getElementById('film-title');
const hintEl     = document.getElementById('film-hint');
const counterEl  = document.getElementById('film-counter');
const centerBtn  = document.getElementById('center-btn');
const centerIcon = document.getElementById('center-icon');
const shareBtn   = document.getElementById('share-btn');
const modePill   = document.getElementById('mode-pill');
const autoBar    = document.getElementById('auto-bar');
const barFill    = document.getElementById('auto-bar-fill');

const ICON_PLAY  = `<polygon points="5 3 19 12 5 21 5 3"/>`;
const ICON_PAUSE = `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`;
const ICON_EYE   = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
const ICON_CHECK = `<polyline points="20 6 9 17 4 12"/>`;

function setCenterIcon(svg, filled = true) {
  centerIcon.innerHTML = svg;
  centerIcon.setAttribute('fill', filled ? 'currentColor' : 'none');
  centerIcon.setAttribute('stroke', filled ? 'none' : 'currentColor');
  centerIcon.setAttribute('stroke-width', filled ? '0' : '2');
  centerIcon.setAttribute('stroke-linecap', 'round');
  centerIcon.setAttribute('stroke-linejoin', 'round');
}

function show(idx) {
  clearTimeout(autoTimer);
  barFill.style.transition = 'none';
  barFill.style.width = '0%';
  isRevealed = false;
  isPaused = false;

  shareBtn.classList.remove('visible', 'copied');
  centerBtn.classList.remove('reveal-pulse');
  block.classList.remove('visible');
  titleEl.classList.remove('revealed');
  hintEl.classList.remove('revealed');
  updateCenterBtn();

  // Update bg color
  targetRGB = films[idx].color;

  setTimeout(() => {
    const f = films[idx];
    emojisEl.textContent  = f.emojis;
    titleEl.textContent   = f.title;
    hintEl.textContent    = f.hint;
    counterEl.textContent = `${idx + 1} / ${films.length}`;
    block.classList.add('visible');
    if (mode === 'discover') startBar(REVEAL_DELAY, reveal);
  }, 300);
}

function updateCenterBtn() {
  if (mode === 'discover') {
    setCenterIcon(isPaused ? ICON_PLAY : ICON_PAUSE, true);
  } else {
    if (!isRevealed) {
      setCenterIcon(ICON_EYE, false);
      centerBtn.classList.add('reveal-pulse');
    } else {
      setCenterIcon(ICON_CHECK, false);
      centerBtn.classList.remove('reveal-pulse');
    }
  }
}

function centerAction() {
  if (mode === 'discover') togglePause();
  else if (!isRevealed) reveal(); else next();
}

function reveal() {
  if (isRevealed) return;
  isRevealed = true;
  titleEl.classList.add('revealed');
  hintEl.classList.add('revealed');
  updateCenterBtn();
  shareBtn.classList.add('visible');
  if (mode === 'discover' && !isPaused) startBar(NEXT_DELAY, next);
}

function next() { current = (current + 1) % films.length; show(current); }
function prev() { current = (current - 1 + films.length) % films.length; show(current); }

function startBar(duration, cb) {
  barFill.style.transition = 'none';
  barFill.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    barFill.style.transition = `width ${duration}ms linear`;
    barFill.style.width = '100%';
  }));
  autoTimer = setTimeout(cb, duration);
}

function togglePause() {
  isPaused = !isPaused;
  if (isPaused) { clearTimeout(autoTimer); barFill.style.transition = 'none'; }
  else if (!isRevealed) startBar(REVEAL_DELAY, reveal);
  else startBar(NEXT_DELAY, next);
  updateCenterBtn();
}

function toggleMode() {
  mode = mode === 'discover' ? 'play' : 'discover';
  modePill.textContent = mode === 'play' ? 'Découvrir' : 'Mode jeu';
  modePill.classList.toggle('play-active', mode === 'play');
  autoBar.classList.toggle('visible', mode === 'discover');
  isPaused = false;
  clearTimeout(autoTimer);
  barFill.style.transition = 'none';
  barFill.style.width = '0%';
  show(current);
}

function share() {
  const f = films[current];
  const text = `${f.emojis}\n= ${f.title}\n\n🎬 Cinémoji — theo.design/emojy`;
  if (navigator.share) navigator.share({ text }).catch(() => {});
  else navigator.clipboard.writeText(text).then(() => {
    shareBtn.classList.add('copied');
    setTimeout(() => shareBtn.classList.remove('copied'), 2000);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); centerAction(); }
  if (e.key === 'ArrowLeft') prev();
});

autoBar.classList.add('visible');
show(0);
if (window.self !== window.top) document.body.classList.add('in-iframe');
</script>
