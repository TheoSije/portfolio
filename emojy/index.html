<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Émojy — theo.design</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #0a0a0a;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: 48px;
  background: #000;
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 14px;
}
.nav-back {
  display: flex;
  align-items: center;
  gap: 7px;
  color: rgba(255,255,255,.32);
  font-size: 12px;
  letter-spacing: .04em;
  transition: color .2s;
  cursor: pointer;
  background: none;
  border: none;
  font-family: 'DM Sans', sans-serif;
  padding: 0;
  text-decoration: none;
}
.nav-back:hover { color: rgba(255,255,255,.7); }
.nav-sep { width: 1px; height: 13px; background: rgba(255,255,255,.1); }
.nav-logo { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.65); }

main {
  height: 100vh;
  padding-top: 48px;
  padding-bottom: 96px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-left: clamp(28px, 6vw, 88px);
  padding-right: clamp(28px, 6vw, 88px);
}

/* ── RIDDLE BLOCK ── */
.riddle-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  width: 100%;
  max-width: 680px;
}

.riddle-label {
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: rgba(255,255,255,.18);
  margin-bottom: 36px;
  opacity: 0;
  transition: opacity .4s ease;
}
.riddle-block.visible .riddle-label { opacity: 1; }

.riddle-emojis {
  font-size: clamp(56px, 15vw, 108px);
  line-height: 1;
  letter-spacing: 0.12em;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity .4s ease .06s, transform .4s ease .06s;
  user-select: none;
}
.riddle-block.visible .riddle-emojis { opacity: 1; transform: translateY(0); }

/* ── ANSWER AREA ── */
.riddle-answer-wrap {
  margin-top: 44px;
  min-height: 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.riddle-answer {
  font-family: 'Playfair Display', serif;
  font-size: clamp(38px, 7vw, 72px);
  font-weight: 800;
  line-height: 1.1;
  opacity: 0;
  transform: scale(0.88) translateY(10px);
  transition: opacity .5s cubic-bezier(0.34,1.2,0.64,1), transform .5s cubic-bezier(0.34,1.2,0.64,1);
  pointer-events: none;
}
.riddle-answer.revealed {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.riddle-explication {
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgba(255,255,255,.24);
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .4s ease .18s, transform .4s ease .18s;
}
.riddle-explication.revealed { opacity: 1; transform: translateY(0); }

/* ── BOTTOM BAR ── */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 0 24px;
  background: #000;
  border-top: 1px solid rgba(255,255,255,.08);
}

.reveal-btn {
  height: 46px;
  padding: 0 22px;
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.07);
  color: rgba(255,255,255,.9);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background .2s, border-color .2s, color .2s, transform .2s cubic-bezier(0.34,1.56,0.64,1);
}
.reveal-btn:hover {
  background: rgba(255,255,255,.13);
  border-color: rgba(255,255,255,.35);
  transform: scale(1.04);
}
.reveal-btn:active { transform: scale(0.95); }
.reveal-btn.done {
  border-color: rgba(255,255,255,.08);
  background: none;
  color: rgba(255,255,255,.25);
  pointer-events: none;
  transform: none;
}

.next-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.13);
  background: rgba(255,255,255,.05);
  color: rgba(255,255,255,.55);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .18s, color .18s, transform .18s;
  padding: 0;
}
.next-btn:hover { background: rgba(255,255,255,.12); color: #fff; transform: scale(1.08); }
.next-btn:active { transform: scale(0.92); }

.share-icon-btn {
  position: absolute;
  right: clamp(28px, 6vw, 88px);
  border: none;
  background: none;
  cursor: pointer;
  color: rgba(255,255,255,.35);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  transition: color .18s;
  padding: 0;
}
.share-icon-btn:hover { color: rgba(255,255,255,.8); }

/* ── SCORE ── */
.score-badge {
  position: absolute;
  left: clamp(28px, 6vw, 88px);
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgba(255,255,255,.2);
}

/* ── SHARE MODAL ── */
.share-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0 0 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease;
}
.share-overlay.open { opacity: 1; pointer-events: all; }
.share-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.share-sheet {
  position: relative;
  z-index: 1;
  width: min(480px, calc(100% - 32px));
  background: rgba(36,34,34,0.96);
  backdrop-filter: blur(32px);
  -webkit-backdrop-filter: blur(32px);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 24px 80px rgba(0,0,0,.6);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  transform: translateY(24px);
  transition: transform .35s cubic-bezier(0.34,1.2,0.64,1);
}
.share-overlay.open .share-sheet { transform: translateY(0); }

.share-preview-wrap { display: flex; justify-content: center; }
#share-canvas {
  border-radius: 12px;
  display: block;
  max-width: 100%;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
}

.share-actions { display: flex; gap: 10px; }
.share-dl-btn {
  flex: 1;
  height: 42px;
  border-radius: 100px;
  border: none;
  background: #fff;
  color: #111;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  cursor: pointer;
  transition: opacity .15s;
}
.share-dl-btn:hover { opacity: .88; }
.share-close-btn {
  height: 42px;
  padding: 0 18px;
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,.12);
  background: none;
  color: rgba(255,255,255,.5);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
}
.share-close-btn:hover { color: #fff; border-color: rgba(255,255,255,.3); }

@media (max-width: 600px) {
  nav { padding: 0 16px; }
  main { padding-left: 20px; padding-right: 20px; }
  .share-icon-btn { right: 16px; }
  .score-badge { left: 16px; }
}

body.in-iframe nav { display: none; }
body.in-iframe main { padding-top: 0; }
</style>
</head>
<body>

<nav>
  <a class="nav-back" href="../" onclick="event.preventDefault();if(window.parent!==window){window.parent.postMessage('close-minisite','*');}else{window.location.href='../';}">← theo.design</a>
  <div class="nav-sep"></div>
  <span class="nav-logo">émojy</span>
</nav>

<main>
  <div class="riddle-block" id="riddle-block">
    <span class="riddle-label">Quel mot se cache ici ?</span>
    <div class="riddle-emojis" id="riddle-emojis"></div>
    <div class="riddle-answer-wrap">
      <div class="riddle-answer" id="riddle-answer"></div>
      <div class="riddle-explication" id="riddle-explication"></div>
    </div>
  </div>
</main>

<div class="bottom-bar">
  <span class="score-badge" id="score-badge"></span>
  <button class="reveal-btn" id="reveal-btn" onclick="reveal()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    Voir la réponse
  </button>
  <button class="next-btn" onclick="next()" title="Suivant">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <button class="share-icon-btn" onclick="openShare()" title="Partager">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
  </button>
</div>

<!-- SHARE MODAL -->
<div class="share-overlay" id="share-overlay">
  <div class="share-backdrop" onclick="closeShare()"></div>
  <div class="share-sheet">
    <div class="share-preview-wrap">
      <canvas id="share-canvas"></canvas>
    </div>
    <div class="share-actions">
      <button class="share-dl-btn" onclick="downloadCard()">↓ Télécharger</button>
      <button class="share-close-btn" onclick="closeShare()">Annuler</button>
    </div>
  </div>
</div>

<script>
const riddles = [
  { emojis: "🐱 💧",       answer: "CHÂTEAU",     explication: "CHAT + EAU = CHÂTEAU" },
  { emojis: "🪣 😄",       answer: "SOURIRE",     explication: "SEAU + RIRE = SOURIRE" },
  { emojis: "🌽 🎵",       answer: "MAISON",      explication: "MAÏS + SON = MAISON" },
  { emojis: "🐀 💧",       answer: "RADEAU",      explication: "RAT + EAU = RADEAU" },
  { emojis: "🌹 💧",       answer: "ROSEAU",      explication: "ROSE + EAU = ROSEAU" },
  { emojis: "🍞 💧",       answer: "PANNEAU",     explication: "PAIN + EAU = PANNEAU" },
  { emojis: "🦊 💧",       answer: "RENARDEAU",   explication: "RENARD + EAU = RENARDEAU" },
  { emojis: "🏔️ 💧",      answer: "MANTEAU",     explication: "MONT + EAU = MANTEAU" },
  { emojis: "🍎 💧",       answer: "POMMEAU",     explication: "POMME + EAU = POMMEAU" },
  { emojis: "🌙 🎵",       answer: "LUNAISON",    explication: "LUNE + SON = LUNAISON" },
  { emojis: "🦁 🎵",       answer: "LIAISON",     explication: "LION + SON = LIAISON" },
  { emojis: "🏔️ 🎵",      answer: "MOUSSON",     explication: "MONT + SON = MOUSSON" },
  { emojis: "🌺 🎵",       answer: "FLORAISON",   explication: "FLORE + SON = FLORAISON" },
  { emojis: "🌊 😄",       answer: "MERVEILLE",   explication: "MER + VEIL + LE... à toi de voir !" },
  { emojis: "🐝 🎵",       answer: "ABÊTISSON",   explication: "ABEILLE + SON — presque !" },
  { emojis: "🌹 🎵",       answer: "RAISONNER",   explication: "ROSE + SON... → RAISONNER" },
  { emojis: "🐟 📅",       answer: "POISSON D'AVRIL", explication: "POISSON + AVRIL = fête du 1er avril" },
  { emojis: "🌞 💧",       answer: "SOLEAU",      explication: "SOLEIL + EAU → SOLEAU (ou juste beau ?)" },
  { emojis: "🌊 🔑",       answer: "MERCI",       explication: "MER + CI — cadeau de la mer" },
  { emojis: "🦋 💧",       answer: "PAPILLEAU",   explication: "PAPILLON + EAU = PAPILLEAU" },
  { emojis: "🐓 🎵",       answer: "COCORICO",    explication: "COQ + SON → COCORICO !" },
  { emojis: "🌊 🌙",       answer: "MAREMONDE",   explication: "MER + MONDE... → un monde à part" },
  { emojis: "🎩 💧",       answer: "CHAPEAUTÉ",   explication: "CHAPEAU + TÉ → être chapeauté" },
  { emojis: "🌳 🎵",       answer: "ARBORESCENCE", explication: "ARBRE + SON + ANCE..." },
  { emojis: "🔑 💧",       answer: "CLÉAU",       explication: "CLÉ + EAU... un clé des eaux ?" },
];

const colorPalette = [
  { from: '#e8d5b7', to: '#c9a87c' },
  { from: '#b8cce4', to: '#8aafd4' },
  { from: '#c8e6c9', to: '#88c98a' },
  { from: '#f5c6d0', to: '#e8929e' },
  { from: '#d4c5e2', to: '#b39dcc' },
  { from: '#fde68a', to: '#e8c547' },
  { from: '#b2dfdb', to: '#7cbfb9' },
  { from: '#ffccbc', to: '#e8a080' },
  { from: '#cfd8dc', to: '#96adb7' },
  { from: '#d7ccc8', to: '#b5a09c' },
  { from: '#c5e1a5', to: '#93c464' },
  { from: '#ffe0b2', to: '#e8b366' },
  { from: '#f8bbd0', to: '#e880a8' },
  { from: '#b3e5fc', to: '#72c9f5' },
  { from: '#e1bee7', to: '#c490d1' },
];

let current = 0;
let currentColorIdx = 0;
let isRevealed = false;
let score = 0;

const block      = document.getElementById('riddle-block');
const emojisEl   = document.getElementById('riddle-emojis');
const answerEl   = document.getElementById('riddle-answer');
const explicEl   = document.getElementById('riddle-explication');
const revealBtn  = document.getElementById('reveal-btn');
const scoreBadge = document.getElementById('score-badge');

function show(idx) {
  block.classList.remove('visible');
  answerEl.classList.remove('revealed');
  explicEl.classList.remove('revealed');
  revealBtn.classList.remove('done');
  revealBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Voir la réponse`;
  isRevealed = false;

  setTimeout(() => {
    const r = riddles[idx];
    emojisEl.textContent = r.emojis;
    answerEl.textContent = r.answer;
    explicEl.textContent = r.explication;

    currentColorIdx = idx % colorPalette.length;
    const c = colorPalette[currentColorIdx];
    const grad = `linear-gradient(135deg, ${c.from} 0%, ${c.to} 100%)`;
    answerEl.style.background = grad;
    answerEl.style.webkitBackgroundClip = 'text';
    answerEl.style.webkitTextFillColor = 'transparent';
    answerEl.style.backgroundClip = 'text';

    scoreBadge.textContent = (idx + 1) + ' / ' + riddles.length;
    block.classList.add('visible');
  }, 260);
}

function reveal() {
  if (isRevealed) return;
  isRevealed = true;
  answerEl.classList.add('revealed');
  explicEl.classList.add('revealed');
  revealBtn.classList.add('done');
  revealBtn.innerHTML = '✓ Révélé';
}

function next() {
  current = (current + 1) % riddles.length;
  show(current);
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    if (!isRevealed) reveal(); else next();
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    current = (current - 1 + riddles.length) % riddles.length;
    show(current);
  }
});

// ── SHARE ──
const canvas = document.getElementById('share-canvas');
const ctx = canvas.getContext('2d');

function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function renderCanvas() {
  const W = 1080, H = 1080;
  const displayScale = Math.min(400 / W, 320 / H);
  canvas.width = W; canvas.height = H;
  canvas.style.width  = Math.round(W * displayScale) + 'px';
  canvas.style.height = Math.round(H * displayScale) + 'px';

  const r = riddles[current];
  const c = colorPalette[currentColorIdx];
  const pad = 108;

  // BG
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  // glow
  const grd = ctx.createRadialGradient(W * 0.5, H * 0.38, 0, W * 0.5, H * 0.38, W * 0.55);
  grd.addColorStop(0, hexAlpha(c.from, 0.18));
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // label
  ctx.font = '500 22px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.textAlign = 'center';
  ctx.fillText('QUEL MOT SE CACHE ICI ?', W / 2, pad + 22);

  // emojis
  ctx.font = '160px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(r.emojis, W / 2, H * 0.44);

  if (isRevealed) {
    // answer gradient
    const tGrad = ctx.createLinearGradient(pad, 0, W - pad, 0);
    tGrad.addColorStop(0, c.from);
    tGrad.addColorStop(1, c.to);
    ctx.font = '800 120px Georgia, serif';
    ctx.fillStyle = tGrad;
    ctx.fillText(r.answer, W / 2, H * 0.68);

    // explication
    ctx.font = '400 32px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.fillText(r.explication, W / 2, H * 0.76);
  } else {
    ctx.font = '800 100px Georgia, serif';
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    ctx.fillText('? ? ?', W / 2, H * 0.68);
  }

  // brand
  ctx.font = '500 28px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.fillText('émojy · theo.design', W / 2, H - 60);
  ctx.textAlign = 'left';
}

function openShare() {
  renderCanvas();
  document.getElementById('share-overlay').classList.add('open');
}
function closeShare() {
  document.getElementById('share-overlay').classList.remove('open');
}
function downloadCard() {
  const link = document.createElement('a');
  link.download = 'emojy-' + (current + 1) + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

current = Math.floor(Math.random() * riddles.length);
show(current);

if (window.self !== window.top) document.body.classList.add('in-iframe');
</script>
</body>
</html>
