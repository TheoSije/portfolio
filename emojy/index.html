<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciné Émoji — theo.design</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #0a0a0a;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 48px; background: #000;
  display: flex; align-items: center; padding: 0 28px; gap: 14px;
}
.nav-back {
  display: flex; align-items: center; gap: 7px;
  color: rgba(255,255,255,.32); font-size: 12px; letter-spacing: .04em;
  transition: color .2s; cursor: pointer;
  background: none; border: none; font-family: 'DM Sans', sans-serif;
  padding: 0; text-decoration: none;
}
.nav-back:hover { color: rgba(255,255,255,.7); }
.nav-sep { width: 1px; height: 13px; background: rgba(255,255,255,.1); }
.nav-logo { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.65); }

.mode-toggle {
  margin-left: auto;
  display: flex;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 100px;
  padding: 3px; gap: 2px;
}
.mode-btn {
  height: 26px; padding: 0 14px; border-radius: 100px; border: none;
  background: none; color: rgba(255,255,255,.4);
  font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500;
  letter-spacing: .03em; cursor: pointer; transition: all .2s;
}
.mode-btn.active { background: rgba(255,255,255,.14); color: #fff; }

main {
  height: 100vh; padding-top: 48px; padding-bottom: 100px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-left: clamp(28px, 6vw, 88px); padding-right: clamp(28px, 6vw, 88px);
}

.film-block {
  display: flex; flex-direction: column; align-items: center;
  text-align: center; width: 100%; max-width: 720px;
}

.film-counter {
  font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
  color: rgba(255,255,255,.16); margin-bottom: 40px;
  opacity: 0; transition: opacity .4s ease;
}
.film-block.visible .film-counter { opacity: 1; }

.film-emojis {
  font-size: clamp(52px, 13vw, 96px); line-height: 1; letter-spacing: 0.1em;
  opacity: 0; transform: translateY(10px);
  transition: opacity .45s ease .08s, transform .45s ease .08s;
  user-select: none; cursor: default;
}
.film-block.visible .film-emojis { opacity: 1; transform: translateY(0); }

.film-answer-wrap {
  margin-top: 52px; min-height: 110px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}

.film-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(32px, 6vw, 64px); font-weight: 800; font-style: italic;
  line-height: 1.1;
  opacity: 0; transform: scale(0.9) translateY(12px);
  transition: opacity .5s cubic-bezier(0.34,1.15,0.64,1), transform .5s cubic-bezier(0.34,1.15,0.64,1);
  pointer-events: none;
  background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,.65) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.film-title.revealed { opacity: 1; transform: scale(1) translateY(0); }

.film-hint {
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: rgba(255,255,255,.22);
  opacity: 0; transform: translateY(4px);
  transition: opacity .4s ease .2s, transform .4s ease .2s;
}
.film-hint.revealed { opacity: 1; transform: translateY(0); }

/* progress bar for auto mode */
.auto-bar {
  position: fixed; bottom: 100px; left: 0; right: 0;
  height: 2px; background: rgba(255,255,255,.06); display: none;
}
.auto-bar.visible { display: block; }
.auto-bar-fill { height: 100%; background: rgba(255,255,255,.3); width: 0%; }

/* ── BOTTOM BAR ── */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 0 24px; background: #000;
  border-top: 1px solid rgba(255,255,255,.07);
}

.pill-btn {
  height: 46px; padding: 0 22px; border-radius: 100px;
  border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07);
  color: rgba(255,255,255,.9); font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 500; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  transition: background .2s, border-color .2s, transform .2s cubic-bezier(0.34,1.56,0.64,1);
}
.pill-btn:hover { background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.35); transform: scale(1.04); }
.pill-btn:active { transform: scale(0.95); }
.pill-btn:disabled {
  border-color: rgba(255,255,255,.07); background: none;
  color: rgba(255,255,255,.2); pointer-events: none; transform: none;
}

.icon-btn {
  width: 46px; height: 46px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05);
  color: rgba(255,255,255,.5); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .18s, color .18s, transform .18s; padding: 0;
}
.icon-btn:hover { background: rgba(255,255,255,.12); color: #fff; transform: scale(1.08); }
.icon-btn:active { transform: scale(0.92); }

.pos-badge {
  position: absolute; left: clamp(28px, 6vw, 88px);
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: rgba(255,255,255,.2);
}

@media (max-width: 600px) {
  nav { padding: 0 16px; }
  main { padding-left: 20px; padding-right: 20px; }
  .pos-badge { left: 16px; }
}

body.in-iframe nav { display: none; }
body.in-iframe main { padding-top: 0; }
</style>
</head>
<body>

<nav>
  <a class="nav-back" href="../" onclick="event.preventDefault();if(window.parent!==window){window.parent.postMessage('close-minisite','*');}else{window.location.href='../';}">← theo.design</a>
  <div class="nav-sep"></div>
  <span class="nav-logo">ciné émoji</span>
  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-discover" onclick="setMode('discover')">Découvrir</button>
    <button class="mode-btn" id="btn-play" onclick="setMode('play')">Jouer</button>
  </div>
</nav>

<main>
  <div class="film-block" id="film-block">
    <span class="film-counter" id="film-counter"></span>
    <div class="film-emojis" id="film-emojis"></div>
    <div class="film-answer-wrap">
      <div class="film-title" id="film-title"></div>
      <div class="film-hint" id="film-hint"></div>
    </div>
  </div>
</main>

<div class="auto-bar" id="auto-bar">
  <div class="auto-bar-fill" id="auto-bar-fill"></div>
</div>

<div class="bottom-bar">
  <span class="pos-badge" id="pos-badge"></span>
  <button class="pill-btn" id="reveal-btn" onclick="reveal()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    Voir le film
  </button>
  <button class="icon-btn" id="next-btn" onclick="next()" title="Suivant">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <button class="pill-btn" id="pause-btn" onclick="togglePause()" style="display:none">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    Pause
  </button>
</div>

<script>
const films = [
  { emojis:'🕺🍔💼🔫💃💉💵', title:'Pulp Fiction',          hint:'Quentin Tarantino · 1994' },
  { emojis:'🦈🏊🩸',          title:'Les Dents de la Mer',   hint:'Steven Spielberg · 1975' },
  { emojis:'🦖🚙🧬',          title:'Jurassic Park',         hint:'Steven Spielberg · 1993' },
  { emojis:'🚍😰',             title:'Duel',                  hint:'Steven Spielberg · 1971' },
  { emojis:'🦁👑',             title:'Le Roi Lion',           hint:'Roger Allers · 1994' },
  { emojis:'🕷️🕸️🦸',         title:'Spider-Man',            hint:'Sam Raimi · 2002' },
  { emojis:'🧙⚡📚',           title:'Harry Potter',          hint:'Chris Columbus · 2001' },
  { emojis:'❄️👸🏔️',          title:'La Reine des Neiges',   hint:'Chris Buck · 2013' },
  { emojis:'🤖🌱❤️',           title:'WALL-E',                hint:'Andrew Stanton · 2008' },
  { emojis:'🦇🌑🌆',           title:'Batman',                hint:'Tim Burton · 1989' },
  { emojis:'🚀⭐⚔️',           title:'Star Wars',             hint:'George Lucas · 1977' },
];

let current = 0, mode = 'discover', isRevealed = false;
let autoTimer = null, isPaused = false;

const REVEAL_DELAY = 3000, NEXT_DELAY = 2500;

const block     = document.getElementById('film-block');
const emojisEl  = document.getElementById('film-emojis');
const titleEl   = document.getElementById('film-title');
const hintEl    = document.getElementById('film-hint');
const counterEl = document.getElementById('film-counter');
const posBadge  = document.getElementById('pos-badge');
const revealBtn = document.getElementById('reveal-btn');
const nextBtn   = document.getElementById('next-btn');
const pauseBtn  = document.getElementById('pause-btn');
const autoBar   = document.getElementById('auto-bar');
const barFill   = document.getElementById('auto-bar-fill');

function show(idx) {
  clearTimeout(autoTimer);
  barFill.style.transition = 'none';
  barFill.style.width = '0%';
  isRevealed = false;

  block.classList.remove('visible');
  titleEl.classList.remove('revealed');
  hintEl.classList.remove('revealed');
  revealBtn.disabled = false;
  revealBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Voir le film`;

  setTimeout(() => {
    const f = films[idx];
    emojisEl.textContent = f.emojis;
    titleEl.textContent  = f.title;
    hintEl.textContent   = f.hint;
    counterEl.textContent = `Film ${idx + 1} sur ${films.length}`;
    posBadge.textContent  = `${idx + 1} / ${films.length}`;
    block.classList.add('visible');

    if (mode === 'discover' && !isPaused) startBar(REVEAL_DELAY, reveal);
  }, 280);
}

function reveal() {
  if (isRevealed) return;
  isRevealed = true;
  titleEl.classList.add('revealed');
  hintEl.classList.add('revealed');
  revealBtn.disabled = true;
  revealBtn.innerHTML = '✓ ' + films[current].title;
  if (mode === 'discover' && !isPaused) startBar(NEXT_DELAY, next);
}

function next() {
  current = (current + 1) % films.length;
  show(current);
}

function startBar(duration, cb) {
  barFill.style.transition = 'none';
  barFill.style.width = '0%';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      barFill.style.transition = `width ${duration}ms linear`;
      barFill.style.width = '100%';
    });
  });
  autoTimer = setTimeout(cb, duration);
}

function togglePause() {
  isPaused = !isPaused;
  if (isPaused) {
    clearTimeout(autoTimer);
    barFill.style.transition = 'none';
    pauseBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Reprendre`;
  } else {
    pauseBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Pause`;
    if (!isRevealed) startBar(REVEAL_DELAY, reveal);
    else startBar(NEXT_DELAY, next);
  }
}

function setMode(m) {
  mode = m;
  isPaused = false;
  clearTimeout(autoTimer);
  barFill.style.transition = 'none';
  barFill.style.width = '0%';

  document.getElementById('btn-discover').classList.toggle('active', m === 'discover');
  document.getElementById('btn-play').classList.toggle('active', m === 'play');
  revealBtn.style.display = m === 'play' ? '' : 'none';
  nextBtn.style.display   = m === 'play' ? '' : 'none';
  pauseBtn.style.display  = m === 'discover' ? '' : 'none';
  autoBar.classList.toggle('visible', m === 'discover');
  pauseBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Pause`;

  show(current);
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    if (mode === 'play') { if (!isRevealed) reveal(); else next(); }
    else togglePause();
  }
  if (e.key === 'ArrowLeft') {
    current = (current - 1 + films.length) % films.length;
    show(current);
  }
});

setMode('discover');
if (window.self !== window.top) document.body.classList.add('in-iframe');
</script>
</body>
</html>
