<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciné Émoji — theo.design</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #0a0a0a;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 48px; background: #000;
  display: flex; align-items: center; padding: 0 28px; gap: 14px;
}
.nav-back {
  display: flex; align-items: center; gap: 7px;
  color: rgba(255,255,255,.32); font-size: 12px; letter-spacing: .04em;
  transition: color .2s; cursor: pointer;
  background: none; border: none; font-family: 'DM Sans', sans-serif;
  padding: 0; text-decoration: none;
}
.nav-back:hover { color: rgba(255,255,255,.7); }
.nav-sep { width: 1px; height: 13px; background: rgba(255,255,255,.1); }
.nav-logo { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.65); }

main {
  height: 100vh; padding-top: 48px; padding-bottom: 88px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-left: clamp(28px, 6vw, 88px); padding-right: clamp(28px, 6vw, 88px);
}

.film-block {
  display: flex; flex-direction: column; align-items: center;
  text-align: center; width: 100%; max-width: 720px;
}

.film-counter {
  font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
  color: rgba(255,255,255,.16); margin-bottom: 40px;
  opacity: 0; transition: opacity .4s ease;
}
.film-block.visible .film-counter { opacity: 1; }

.film-emojis {
  font-size: clamp(52px, 13vw, 96px); line-height: 1; letter-spacing: 0.1em;
  opacity: 0; transform: translateY(10px);
  transition: opacity .45s ease .08s, transform .45s ease .08s;
  user-select: none; cursor: default;
}
.film-block.visible .film-emojis { opacity: 1; transform: translateY(0); }

.film-answer-wrap {
  margin-top: 52px; min-height: 110px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}

.film-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(32px, 6vw, 64px); font-weight: 800; font-style: italic;
  line-height: 1.1;
  opacity: 0; transform: scale(0.9) translateY(12px);
  transition: opacity .5s cubic-bezier(0.34,1.15,0.64,1), transform .5s cubic-bezier(0.34,1.15,0.64,1);
  pointer-events: none;
  background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,.65) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.film-title.revealed { opacity: 1; transform: scale(1) translateY(0); }

.film-hint {
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: rgba(255,255,255,.22);
  opacity: 0; transform: translateY(4px);
  transition: opacity .4s ease .2s, transform .4s ease .2s;
}
.film-hint.revealed { opacity: 1; transform: translateY(0); }

/* progress bar */
.auto-bar {
  position: fixed; bottom: 88px; left: 0; right: 0;
  height: 2px; background: rgba(255,255,255,.06); display: none;
}
.auto-bar.visible { display: block; }
.auto-bar-fill { height: 100%; background: rgba(255,255,255,.3); width: 0%; }

/* ── BOTTOM BAR — calqué sur inkipit ── */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
  height: 88px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 clamp(20px, 5vw, 48px) 16px;
  background: #000;
  border-top: 1px solid rgba(255,255,255,.07);
}

/* Left: mode button */
.mode-pill {
  justify-self: start;
  height: 34px; padding: 0 16px; border-radius: 100px;
  border: 1px solid rgba(255,255,255,.18); background: none;
  color: rgba(255,255,255,.5); font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 500; letter-spacing: .02em;
  cursor: pointer; transition: color .2s, border-color .2s;
  white-space: nowrap;
}
.mode-pill:hover { color: rgba(255,255,255,.85); border-color: rgba(255,255,255,.35); }
.mode-pill.play-active { color: rgba(255,255,255,.9); border-color: rgba(255,255,255,.35); }

/* Center: ← ▶/⏸/● → */
.nav-controls {
  display: flex; align-items: center; gap: 16px;
}

.arrow-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: none; background: none;
  color: rgba(255,255,255,.35); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color .18s, transform .18s; padding: 0;
}
.arrow-btn:hover { color: rgba(255,255,255,.8); transform: scale(1.1); }
.arrow-btn:active { transform: scale(0.9); }

.center-btn {
  width: 48px; height: 48px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08);
  color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .18s, border-color .18s, transform .2s cubic-bezier(0.34,1.56,0.64,1);
  padding: 0;
}
.center-btn:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.55); transform: scale(1.08); }
.center-btn:active { transform: scale(0.93); }
.center-btn.reveal-pulse {
  border-color: rgba(255,255,255,.6);
  background: rgba(255,255,255,.14);
}

/* Right: share icon */
.share-zone {
  justify-self: end;
}
.share-icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: none; background: none;
  color: rgba(255,255,255,.3); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color .2s, transform .18s; padding: 0;
  opacity: 0; pointer-events: none;
  transition: color .2s, transform .18s, opacity .3s;
}
.share-icon-btn.visible { opacity: 1; pointer-events: auto; }
.share-icon-btn:hover { color: rgba(255,255,255,.85); transform: scale(1.12); }
.share-icon-btn:active { transform: scale(0.9); }
.share-icon-btn.copied { color: rgba(120,255,160,.85); }

@media (max-width: 600px) {
  nav { padding: 0 16px; }
  main { padding-left: 20px; padding-right: 20px; }
  .bottom-bar { padding: 0 16px 16px; }
}

body.in-iframe nav { display: none; }
body.in-iframe main { padding-top: 0; }
</style>
</head>
<body>

<nav>
  <a class="nav-back" href="../" onclick="event.preventDefault();if(window.parent!==window){window.parent.postMessage('close-minisite','*');}else{window.location.href='../';}">← theo.design</a>
  <div class="nav-sep"></div>
  <span class="nav-logo">ciné émoji</span>
</nav>

<main>
  <div class="film-block" id="film-block">
    <span class="film-counter" id="film-counter"></span>
    <div class="film-emojis" id="film-emojis"></div>
    <div class="film-answer-wrap">
      <div class="film-title" id="film-title"></div>
      <div class="film-hint" id="film-hint"></div>
    </div>
  </div>
</main>

<div class="auto-bar" id="auto-bar">
  <div class="auto-bar-fill" id="auto-bar-fill"></div>
</div>

<div class="bottom-bar">
  <!-- Left: mode toggle -->
  <button class="mode-pill" id="mode-pill" onclick="toggleMode()">Mode jeu</button>

  <!-- Center: ← ▶/⏸ → -->
  <div class="nav-controls">
    <button class="arrow-btn" onclick="prev()" title="Précédent">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="center-btn" id="center-btn" onclick="centerAction()">
      <svg id="center-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
    <button class="arrow-btn" onclick="next()" title="Suivant">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <!-- Right: share -->
  <div class="share-zone">
    <button class="share-icon-btn" id="share-btn" onclick="share()" title="Partager">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    </button>
  </div>
</div>

<script>
const films = [
  { emojis:'🕺🍔💼🔫💃💉💵', title:'Pulp Fiction',             hint:'Quentin Tarantino · 1994' },
  { emojis:'🦈🏊🩸',          title:'Les Dents de la Mer',      hint:'Steven Spielberg · 1975' },
  { emojis:'🦖🚙🧬',          title:'Jurassic Park',            hint:'Steven Spielberg · 1993' },
  { emojis:'🚍😰',             title:'Duel',                     hint:'Steven Spielberg · 1971' },
  { emojis:'🦁👑',             title:'Le Roi Lion',              hint:'Roger Allers · 1994' },
  { emojis:'🕷️🕸️🦸',         title:'Spider-Man',               hint:'Sam Raimi · 2002' },
  { emojis:'🧙⚡📚',           title:'Harry Potter',             hint:'Chris Columbus · 2001' },
  { emojis:'❄️👸🏔️',          title:'La Reine des Neiges',      hint:'Chris Buck · 2013' },
  { emojis:'🤖🌱❤️',           title:'WALL-E',                   hint:'Andrew Stanton · 2008' },
  { emojis:'🦇🌑🌆',           title:'Batman',                   hint:'Tim Burton · 1989' },
  { emojis:'🚀⭐⚔️',           title:'Star Wars',                hint:'George Lucas · 1977' },
  { emojis:'🕰️🚗⚡🔙',        title:'Retour vers le Futur',     hint:'Robert Zemeckis · 1985' },
  { emojis:'🧊🚢💔🌊',        title:'Titanic',                  hint:'James Cameron · 1997' },
  { emojis:'💊🕶️🐰🕳️',       title:'Matrix',                   hint:'Wachowski · 1999' },
  { emojis:'🐟🌊🔍',           title:'Le Monde de Nemo',         hint:'Andrew Stanton · 2003' },
  { emojis:'🧸🤠♾️',           title:'Toy Story',                hint:'John Lasseter · 1995' },
  { emojis:'🧝⚔️💍🔥',         title:'Le Seigneur des Anneaux',  hint:'Peter Jackson · 2001' },
  { emojis:'😊😢😡😨❤️',       title:'Vice-Versa',               hint:'Pete Docter · 2015' },
  { emojis:'🐀👨‍🍳⭐',          title:'Ratatouille',              hint:'Brad Bird · 2007' },
  { emojis:'🌀🛌🏙️🌊',        title:'Inception',                hint:'Christopher Nolan · 2010' },
  { emojis:'🌌⏳👩‍👧🖖',        title:'Interstellar',             hint:'Christopher Nolan · 2014' },
  { emojis:'🤠💀☠️🌊',        title:'Pirates des Caraïbes',     hint:'Gore Verbinski · 2003' },
  { emojis:'🍫🎩🏭🐛',         title:'Charlie et la Chocolaterie', hint:'Tim Burton · 2005' },
  { emojis:'🦸🦸‍♀️🦸‍♂️💥',    title:'Les Indestructibles',      hint:'Brad Bird · 2004' },
  { emojis:'🦁🌿🐒',           title:'Le Livre de la Jungle',    hint:'Jon Favreau · 2016' },
  { emojis:'👻🏚️👁️',          title:'Ghostbusters',             hint:'Ivan Reitman · 1984' },
  { emojis:'🌹🐗🕰️',           title:'La Belle et la Bête',      hint:'Gary Trousdale · 1991' },
  { emojis:'🐬🌊🌅',            title:'Le Grand Bleu',            hint:'Luc Besson · 1988' },
  { emojis:'🚂🎄🔔⭐',          title:'Le Pôle Express',          hint:'Robert Zemeckis · 2004' },
  { emojis:'🧊🏔️🌬️🐺',        title:'Balto',                    hint:'Simon Wells · 1995' },
];

let current = 0, mode = 'discover', isRevealed = false;
let autoTimer = null, isPaused = false;

const REVEAL_DELAY = 3000, NEXT_DELAY = 2500;

const block      = document.getElementById('film-block');
const emojisEl   = document.getElementById('film-emojis');
const titleEl    = document.getElementById('film-title');
const hintEl     = document.getElementById('film-hint');
const counterEl  = document.getElementById('film-counter');
const centerBtn  = document.getElementById('center-btn');
const centerIcon = document.getElementById('center-icon');
const shareBtn   = document.getElementById('share-btn');
const modePill   = document.getElementById('mode-pill');
const autoBar    = document.getElementById('auto-bar');
const barFill    = document.getElementById('auto-bar-fill');

// SVG icons
const ICON_PLAY  = `<polygon points="5 3 19 12 5 21 5 3"/>`;
const ICON_PAUSE = `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`;
const ICON_EYE   = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
const ICON_CHECK = `<polyline points="20 6 9 17 4 12"/>`;

function setCenterIcon(svg, filled = true) {
  centerIcon.innerHTML = svg;
  centerIcon.setAttribute('fill', filled ? 'currentColor' : 'none');
  centerIcon.setAttribute('stroke', filled ? 'none' : 'currentColor');
  centerIcon.setAttribute('stroke-width', filled ? '0' : '2');
  centerIcon.setAttribute('stroke-linecap', 'round');
  centerIcon.setAttribute('stroke-linejoin', 'round');
}

function show(idx) {
  clearTimeout(autoTimer);
  barFill.style.transition = 'none';
  barFill.style.width = '0%';
  isRevealed = false;
  isPaused = false;

  shareBtn.classList.remove('visible', 'copied');
  centerBtn.classList.remove('reveal-pulse');

  block.classList.remove('visible');
  titleEl.classList.remove('revealed');
  hintEl.classList.remove('revealed');

  updateCenterBtn();

  setTimeout(() => {
    const f = films[idx];
    emojisEl.textContent = f.emojis;
    titleEl.textContent  = f.title;
    hintEl.textContent   = f.hint;
    counterEl.textContent = `Film ${idx + 1} sur ${films.length}`;
    block.classList.add('visible');

    if (mode === 'discover') startBar(REVEAL_DELAY, reveal);
  }, 280);
}

function updateCenterBtn() {
  if (mode === 'discover') {
    if (isPaused) {
      setCenterIcon(ICON_PLAY, true);
    } else {
      setCenterIcon(ICON_PAUSE, true);
    }
  } else {
    // play mode
    if (!isRevealed) {
      setCenterIcon(ICON_EYE, false);
      centerBtn.classList.add('reveal-pulse');
    } else {
      setCenterIcon(ICON_CHECK, false);
      centerBtn.classList.remove('reveal-pulse');
    }
  }
}

function centerAction() {
  if (mode === 'discover') {
    togglePause();
  } else {
    if (!isRevealed) reveal();
    else next();
  }
}

function reveal() {
  if (isRevealed) return;
  isRevealed = true;
  titleEl.classList.add('revealed');
  hintEl.classList.add('revealed');
  updateCenterBtn();
  shareBtn.classList.add('visible');
  if (mode === 'discover' && !isPaused) startBar(NEXT_DELAY, next);
}

function next() {
  current = (current + 1) % films.length;
  show(current);
}

function prev() {
  current = (current - 1 + films.length) % films.length;
  show(current);
}

function startBar(duration, cb) {
  barFill.style.transition = 'none';
  barFill.style.width = '0%';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      barFill.style.transition = `width ${duration}ms linear`;
      barFill.style.width = '100%';
    });
  });
  autoTimer = setTimeout(cb, duration);
}

function togglePause() {
  isPaused = !isPaused;
  if (isPaused) {
    clearTimeout(autoTimer);
    barFill.style.transition = 'none';
  } else {
    if (!isRevealed) startBar(REVEAL_DELAY, reveal);
    else startBar(NEXT_DELAY, next);
  }
  updateCenterBtn();
}

function toggleMode() {
  mode = mode === 'discover' ? 'play' : 'discover';
  modePill.textContent = mode === 'play' ? 'Découvrir' : 'Mode jeu';
  modePill.classList.toggle('play-active', mode === 'play');
  autoBar.classList.toggle('visible', mode === 'discover');
  isPaused = false;
  clearTimeout(autoTimer);
  barFill.style.transition = 'none';
  barFill.style.width = '0%';
  show(current);
}

function share() {
  const f = films[current];
  const text = `${f.emojis}\n= ${f.title}\n\n🎬 Ciné Émoji — theo.design/emojy`;
  if (navigator.share) {
    navigator.share({ text }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text).then(() => {
      shareBtn.classList.add('copied');
      setTimeout(() => shareBtn.classList.remove('copied'), 2000);
    });
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    centerAction();
  }
  if (e.key === 'ArrowLeft') prev();
});

// init
autoBar.classList.add('visible');
show(0);
if (window.self !== window.top) document.body.classList.add('in-iframe');
</script>
</body>
</html>
