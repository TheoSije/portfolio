<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unheard — Songs nobody listened to</title>
<meta name="description" content="Découvre des morceaux Spotify à 0 plays que personne n'a jamais écoutés. Un player pour explorer la musique invisible.">
<link rel="canonical" href="https://jegousse.com/unheard/">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --text: #f0ece0;
    --muted: #555;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  #bg-art {
    position: fixed;
    inset: 0;
    z-index: 0;
    transition: background 1.2s ease;
    filter: blur(80px) saturate(0.3) brightness(0.25);
    transform: scale(1.2);
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 3rem;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.15em;
    color: var(--text);
    opacity: 0.9;
  }

  .tagline {
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  #cover-wrap {
    width: 100%;
    aspect-ratio: 1;
    position: relative;
    margin-bottom: 2rem;
    overflow: hidden;
  }

  #cover {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  #cover.loaded { opacity: 1; }

  #cover-placeholder {
    position: absolute;
    inset: 0;
    background: #161616;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vinyl {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: repeating-conic-gradient(#2a2a2a 0deg 10deg, #1a1a1a 10deg 20deg);
    border: 2px solid #333;
    position: relative;
    animation: spin 4s linear infinite;
    animation-play-state: paused;
  }

  .vinyl::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #161616;
    border: 1px solid #2a2a2a;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  .vinyl.spinning { animation-play-state: running; }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  #play-count-badge {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: rgba(10,10,10,0.85);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 0.4rem 0.8rem;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text);
    backdrop-filter: blur(8px);
  }

  #play-count-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.05em;
    display: block;
    line-height: 1;
  }

  .track-info {
    width: 100%;
    margin-bottom: 2rem;
  }

  #track-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    letter-spacing: 0.04em;
    line-height: 1.05;
    color: var(--text);
    margin-bottom: 0.4rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #track-artist {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  #track-genre {
    display: inline-block;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid #333;
    padding: 2px 8px;
    margin-top: 0.6rem;
  }

  .progress-wrap {
    width: 100%;
    margin-bottom: 2rem;
    cursor: pointer;
    position: relative;
    height: 2px;
    background: #222;
  }

  #progress-bar {
    height: 100%;
    background: var(--text);
    width: 0%;
    transition: width 0.3s linear;
    pointer-events: none;
  }

  .controls {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  button {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text);
    padding: 0;
    font-family: 'DM Mono', monospace;
    transition: opacity 0.2s;
  }

  button:hover { opacity: 0.6; }
  button:disabled { opacity: 0.2; cursor: not-allowed; }

  #btn-play {
    width: 52px;
    height: 52px;
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #btn-play svg { width: 18px; height: 18px; fill: var(--text); }

  #btn-skip {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid transparent;
  }

  #btn-skip:hover { color: var(--text); border-color: var(--text); opacity: 1; }

  #btn-ext {
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #btn-ext:hover { color: var(--text); opacity: 1; }

  .time-info {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-top: 0.4rem;
  }

  #status {
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 2.5rem;
    text-align: center;
    min-height: 1rem;
  }

  .fade-in { animation: fadeIn 0.6s ease forwards; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .loading-dots::after {
    content: '';
    animation: dots 1.2s steps(4, end) infinite;
  }

  @keyframes dots {
    0%, 100% { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
  }
</style>
</head>
<body>

<div id="bg-art"></div>

<div class="container">
  <header>
    <span class="logo">UNHEARD</span>
    <span class="tagline">Songs nobody listened to</span>
  </header>

  <div id="cover-wrap">
    <div id="cover-placeholder">
      <div class="vinyl" id="vinyl"></div>
    </div>
    <img id="cover" alt="cover art" crossorigin="anonymous" />
    <div id="play-count-badge">
      <span id="play-count-num">—</span>
      favorites
    </div>
  </div>

  <div class="track-info fade-in">
    <div id="track-title">—</div>
    <div id="track-artist">—</div>
    <div id="track-genre" style="display:none"></div>
  </div>

  <div class="progress-wrap" id="progress-wrap">
    <div id="progress-bar"></div>
  </div>
  <div class="time-info">
    <span id="time-current">0:00</span>
    <span id="time-total">—:——</span>
  </div>

  <div class="controls">
    <button id="btn-ext" title="Open on Audius">↗ audius</button>
    <button id="btn-play" title="Play / Pause">
      <svg id="icon-play"  viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button id="btn-skip">next →</button>
  </div>

  <div id="status" class="loading-dots">Loading</div>
</div>

<audio id="audio" crossorigin="anonymous" preload="none"></audio>

<script>
const APP_NAME = 'UNHEARD_PORTFOLIO';

const audio         = document.getElementById('audio');
const cover         = document.getElementById('cover');
const bgArt         = document.getElementById('bg-art');
const trackTitle    = document.getElementById('track-title');
const trackArtist   = document.getElementById('track-artist');
const trackGenre    = document.getElementById('track-genre');
const playCountNum  = document.getElementById('play-count-num');
const progressBar   = document.getElementById('progress-bar');
const progressWrap  = document.getElementById('progress-wrap');
const btnPlay       = document.getElementById('btn-play');
const btnSkip       = document.getElementById('btn-skip');
const btnExt        = document.getElementById('btn-ext');
const iconPlay      = document.getElementById('icon-play');
const iconPause     = document.getElementById('icon-pause');
const timeCurrentEl = document.getElementById('time-current');
const timeTotalEl   = document.getElementById('time-total');
const statusEl      = document.getElementById('status');
const vinyl         = document.getElementById('vinyl');
const placeholder   = document.getElementById('cover-placeholder');

let apiHost      = null;
let currentTrack = null;
let isPlaying    = false;

const GENRES = [
  'Electronic', 'Ambient', 'Lo-Fi', 'Experimental', 'Indie',
  'Acoustic', 'Folk', 'Chill', 'Alternative', 'Jazz',
  'Synth', 'Dream Pop', 'Post-Rock', 'Soul', 'Shoegaze'
];

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function setStatus(txt, loading = false) {
  statusEl.textContent = txt;
  statusEl.className   = loading ? 'loading-dots' : '';
}

/* ── Discover a working Audius node ── */
async function getHost() {
  if (apiHost) return apiHost;
  const res  = await fetch('https://api.audius.co');
  const data = await res.json();
  const hosts = data.data;
  apiHost = hosts[Math.floor(Math.random() * hosts.length)];
  return apiHost;
}

/* ── Fetch a random low-engagement track ── */
async function fetchTrack(autoPlay = false) {
  btnPlay.disabled = true;
  btnSkip.disabled = true;
  setStatus('Finding something unheard', true);

  try {
    const h     = await getHost();
    const genre = GENRES[Math.floor(Math.random() * GENRES.length)];
    const offset = Math.floor(Math.random() * 800);

    const url  = `${h}/v1/tracks/search?query=${encodeURIComponent(genre)}&limit=100&offset=${offset}&app_name=${APP_NAME}`;
    const res  = await fetch(url);
    if (!res.ok) throw new Error(`API ${res.status}`);
    const data   = await res.json();
    const tracks = data.data || [];

    if (tracks.length === 0) {
      setStatus('Searching deeper...');
      setTimeout(fetchTrack, 900);
      return;
    }

    /* Prefer tracks with very few favorites — proxy for "unheard" */
    const quiet = tracks
      .filter(t => typeof t.favorite_count === 'number' && t.favorite_count <= 20)
      .sort((a, b) => a.favorite_count - b.favorite_count);

    const pool  = quiet.length > 0 ? quiet : tracks;
    const track = pool[Math.floor(Math.random() * Math.min(pool.length, 8))];

    loadTrack(track, h, autoPlay);
  } catch (e) {
    setStatus('Connection issue — retrying...');
    apiHost = null; /* reset on error, try another node */
    setTimeout(fetchTrack, 1500);
  }
}

/* ── Load track into player ── */
function loadTrack(track, h, autoPlay = false) {
  currentTrack = track;
  audio.pause();
  isPlaying = false;
  updatePlayUI();

  trackTitle.textContent  = track.title || 'Unknown title';
  trackArtist.textContent = track.user?.name || track.user?.handle || 'Unknown artist';

  const favs = track.favorite_count ?? 0;
  playCountNum.textContent = favs.toLocaleString();

  if (track.genre) {
    trackGenre.textContent   = track.genre;
    trackGenre.style.display = 'inline-block';
  } else {
    trackGenre.style.display = 'none';
  }

  /* Artwork */
  const art    = track.artwork;
  const artUrl = art?.['_480x480'] || art?.['_150x150'] || art?.['_1000x1000'] || null;

  cover.classList.remove('loaded');
  placeholder.style.opacity = '1';

  if (artUrl) {
    cover.src    = artUrl;
    cover.onload = () => {
      cover.classList.add('loaded');
      placeholder.style.opacity = '0';
      extractColor(artUrl);
    };
    cover.onerror = () => { bgArt.style.background = '#1a1a2e'; };
  } else {
    bgArt.style.background = '#1a1a2e';
  }

  /* Stream */
  audio.src = `${h}/v1/tracks/${track.id}/stream?app_name=${APP_NAME}`;
  audio.load();

  progressBar.style.width   = '0%';
  timeCurrentEl.textContent = '0:00';
  timeTotalEl.textContent   = track.duration ? fmtTime(track.duration) : '—:——';

  btnPlay.disabled = false;
  btnSkip.disabled = false;

  if (autoPlay) {
    audio.addEventListener('canplay', function onReady() {
      audio.removeEventListener('canplay', onReady);
      audio.play().then(() => { isPlaying = true; updatePlayUI(); }).catch(() => {});
    }, { once: true });
  }

  /* External link */
  const permalink = track.permalink
    ? (track.permalink.startsWith('http') ? track.permalink : `https://audius.co${track.permalink}`)
    : 'https://audius.co';
  btnExt.onclick = () => window.open(permalink, '_blank');

  setStatus(
    favs === 0  ? '◆ zero favorites — truly unheard' :
    favs <= 10  ? `◆ only ${favs} favorites` :
                  `◆ ${favs.toLocaleString()} favorites`
  );
}

/* ── Extract dominant color from cover art ── */
function extractColor(imgUrl) {
  const img        = new Image();
  img.crossOrigin  = 'anonymous';
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 8;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 8, 8);
    const d = ctx.getImageData(0, 0, 8, 8).data;
    let r = 0, g = 0, b = 0;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; }
    const px = d.length / 4;
    r = Math.round(r / px); g = Math.round(g / px); b = Math.round(b / px);
    bgArt.style.background = `radial-gradient(ellipse at 50% 40%, rgb(${r},${g},${b}) 0%, rgb(${Math.round(r*.4)},${Math.round(g*.4)},${Math.round(b*.4)}) 100%)`;
  };
  img.src = imgUrl;
}

function updatePlayUI() {
  iconPlay.style.display  = isPlaying ? 'none'  : 'block';
  iconPause.style.display = isPlaying ? 'block' : 'none';
  isPlaying ? vinyl.classList.add('spinning') : vinyl.classList.remove('spinning');
}

/* ── Controls ── */
btnPlay.addEventListener('click', () => {
  if (!currentTrack) return;
  if (isPlaying) {
    audio.pause(); isPlaying = false;
  } else {
    audio.play().catch(() => setStatus('tap play again'));
    isPlaying = true;
  }
  updatePlayUI();
});

btnSkip.addEventListener('click', () => {
  audio.pause(); isPlaying = false;
  updatePlayUI();
  fetchTrack(true);
});

audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    progressBar.style.width   = (audio.currentTime / audio.duration * 100) + '%';
    timeCurrentEl.textContent = fmtTime(audio.currentTime);
  }
});

audio.addEventListener('ended', () => {
  isPlaying = false;
  updatePlayUI();
  setTimeout(fetchTrack, 800);
});

audio.addEventListener('error', () => {
  setStatus('stream error — skipping');
  setTimeout(fetchTrack, 1200);
});

progressWrap.addEventListener('click', e => {
  if (!audio.duration) return;
  const rect = progressWrap.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
});

/* ── Init ── */
fetchTrack();
</script>
</body>
</html>
